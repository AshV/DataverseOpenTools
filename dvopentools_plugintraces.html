<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plugin Trace Log Streamer</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "plugin-traces",
    "name":           "Plugin Trace Logs",
    "version":        "1.1.0",
    "description":    "Stream and filter Dataverse plugintracelog entries, trace full correlation cascades by depth, inspect stack traces, and spot slow plugins.",
    "icon":           "📜",
    "category":       "Diagnostics",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>

  <style>
    .pt-pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); margin-right: 4px; }
    .pt-pulse.live { background: var(--ok-color); box-shadow: 0 0 0 3px rgba(16,124,16,0.2); }
    .pt-detail { width: 440px; flex-shrink: 0; border-left: 1px solid var(--border); background: var(--bg-alt); display: none; flex-direction: column; overflow: hidden; }
    .pt-detail.open { display: flex; }
  </style>
</head>
<body class="dv-app">

  <div class="dv-toolbar">
    <select id="f-range">
      <option value="15m">Last 15 min</option><option value="1h" selected>Last 1 hour</option>
      <option value="24h">Last 24 hours</option><option value="7d">Last 7 days</option>
    </select>
    <select id="f-mode">
      <option value="ALL">Sync + Async</option><option value="0">Sync Only</option><option value="1">Async Only</option>
    </select>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;">
      <input type="checkbox" id="f-errors"> Errors Only
    </label>
    <input type="number" id="f-mindur" placeholder="Min ms" style="width:76px;" min="0">
    <input type="text" id="f-search" placeholder="Filter plugin, entity, message, trace…" style="width:220px;">
    <input type="text" id="f-corr" placeholder="Correlation ID (optional)" style="width:185px;font-family:monospace;">
    <div class="dv-spacer"></div>
    <select id="auto-poll">
      <option value="0">Stream: Off</option><option value="5000">Stream: 5s</option>
      <option value="15000">Stream: 15s</option><option value="30000">Stream: 30s</option>
    </select>
    <button class="dv-btn dv-btn-primary" id="btn-refresh">↻ Refresh</button>
    <button class="dv-btn" id="btn-export">📥 CSV</button>
  </div>

  <div class="dv-strip">
    <span><span class="pt-pulse" id="live-dot"></span><strong id="st-total">0</strong> traces</span>
    <span>Errors: <strong id="st-errors" style="color:var(--err-color);">0</strong></span>
    <span>Avg Duration: <strong id="st-avg">0 ms</strong></span>
    <span>Max Duration: <strong id="st-max">0 ms</strong></span>
    <div class="dv-spacer"></div>
    <button class="dv-btn dv-btn-sm" id="btn-clear-corr" style="display:none;">✕ Clear Correlation Filter</button>
  </div>

  <div class="dv-split">
    <div class="dv-scroll">
      <table class="dv-table">
        <thead><tr><th>Time</th><th>Status</th><th>Plugin Type</th><th>Message</th><th>Entity</th><th>Depth</th><th>Mode</th><th>Duration</th></tr></thead>
        <tbody id="trace-tbody"><tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-sec);">Connecting to Dataverse…</td></tr></tbody>
      </table>
    </div>

    <aside class="pt-detail" id="detail-pane">
      <div class="dv-card-hdr">
        <span>Trace Inspector</span>
        <div style="display:flex;gap:6px;">
          <button class="dv-btn dv-btn-sm" id="btn-filter-corr">🔗 Trace Cascade</button>
          <button class="dv-btn dv-btn-sm" id="btn-copy-report">📋 Copy Report</button>
          <button class="dv-btn dv-btn-sm" id="btn-close-detail">✕</button>
        </div>
      </div>
      <div class="dv-scroll dv-pad" id="detail-body"></div>
    </aside>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Plugin Trace Log Streamer</span>
    <div class="dv-spacer"></div>
    <span>Requires Dataverse Plugin Trace Log enabled in Admin Center</span>
  </footer>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let context = null, store = null, logs = [], selectedLog = null, pollTimer = null;

    window.parent?.postMessage({ source: 'dvopentools-tool', type: 'TOOL_READY', payload: {} }, HOST_ORIGIN);
    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      const { type, payload } = e.data;
      if (type === 'CONTEXT_INIT') { context = payload; onContextReady(); }
      if (type === 'TOOL_LAUNCH' && payload?.correlationId) {
        document.getElementById('f-corr').value = payload.correlationId;
        fetchLogs();
      }
    });

    async function onContextReady() {
      store = DV.store('plugin-traces');
      const savedRange = store.get('range');
      if (savedRange) document.getElementById('f-range').value = savedRange;
      if (context.launchData?.correlationId) document.getElementById('f-corr').value = context.launchData.correlationId;
      await fetchLogs();
    }

    function getRangeIso(code) {
      const msMap = { '15m': 900000, '1h': 3600000, '24h': 86400000, '7d': 604800000 };
      return new Date(Date.now() - (msMap[code] || 3600000)).toISOString();
    }

    async function fetchLogs() {
      if (!context || !window.DV) return;
      const range = document.getElementById('f-range').value;
      const modeVal = document.getElementById('f-mode').value;
      const errorsOnly = document.getElementById('f-errors').checked;
      const corrId = document.getElementById('f-corr').value.trim();
      store.set('range', range);

      const filters = [corrId ? `correlationid eq ${corrId}` : `createdon ge ${getRangeIso(range)}`];
      if (modeVal !== 'ALL') filters.push(`mode eq ${modeVal}`);
      if (errorsOnly) filters.push(`exceptiondetails ne null`);

      const select = 'plugintracelogid,typename,messagename,primaryentity,depth,mode,operationtype,performanceexecutionduration,performanceexecutionstarttime,createdon,correlationid,requestid,exceptiondetails,messageblock,configuration';
      const orderBy = corrId ? 'performanceexecutionstarttime asc,depth asc' : 'createdon desc';

      try {
        const json = await DV.fetch(`/plugintracelogs?$select=${select}&$filter=${encodeURIComponent(filters.join(' and '))}&$orderby=${encodeURIComponent(orderBy)}&$top=250`);
        logs = json.value || [];
        renderTable();
      } catch (err) {
        document.getElementById('trace-tbody').innerHTML = `<tr><td colspan="8" style="color:var(--err-color);padding:20px;">❌ ${DV.esc(err.message)}</td></tr>`;
        DV.notify(err.message, 'error');
      }
    }

    function getFilteredLogs() {
      const q = document.getElementById('f-search').value.trim().toLowerCase();
      const minDur = parseInt(document.getElementById('f-mindur').value, 10) || 0;
      return logs.filter(l => (minDur <= 0 || (l.performanceexecutionduration || 0) >= minDur) &&
        (!q || `${l.typename || ''} ${l.messagename || ''} ${l.primaryentity || ''} ${l.messageblock || ''} ${l.exceptiondetails || ''}`.toLowerCase().includes(q)));
    }

    function renderTable() {
      const filtered = getFilteredLogs();
      const tbody = document.getElementById('trace-tbody');
      document.getElementById('btn-clear-corr').style.display = document.getElementById('f-corr').value.trim() ? 'inline-block' : 'none';

      let errCount = 0, sumDur = 0, maxDur = 0;
      for (const l of filtered) {
        if (l.exceptiondetails) errCount++;
        const d = Number(l.performanceexecutionduration) || 0;
        sumDur += d; if (d > maxDur) maxDur = d;
      }
      document.getElementById('st-total').textContent = filtered.length;
      document.getElementById('st-errors').textContent = errCount;
      document.getElementById('st-avg').textContent = filtered.length ? `${Math.round(sumDur / filtered.length)} ms` : '0 ms';
      document.getElementById('st-max').textContent = `${maxDur} ms`;
      DV.setTitle(errCount ? `Traces — ${errCount} errors` : `Traces (${filtered.length})`);

      if (!filtered.length) { tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:30px;color:var(--text-sec);">No plugin trace logs match the active filters.</td></tr>'; return; }

      tbody.innerHTML = filtered.map(l => {
        const hasErr = !!l.exceptiondetails, dur = l.performanceexecutionduration ?? '—';
        const sel = selectedLog?.plugintracelogid === l.plugintracelogid;
        return `<tr data-id="${DV.esc(l.plugintracelogid)}" style="${sel ? 'background:var(--primary-subtle);font-weight:600;' : ''}cursor:pointer;">
          <td>${DV.esc(l.createdon ? new Date(l.createdon).toLocaleTimeString(undefined, { hour12: false }) : '—')}</td>
          <td>${DV.ui.badge(hasErr ? 'Error' : 'OK', hasErr ? 'err' : 'ok')}</td>
          <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${DV.esc(l.typename || '')}">${DV.esc(l.typename || '—')}</td>
          <td><code>${DV.esc(l.messagename || '—')}</code></td>
          <td><code>${DV.esc(l.primaryentity || 'none')}</code></td>
          <td>${'· '.repeat(Math.max(0, (l.depth || 1) - 1))}${l.depth ?? 1}</td>
          <td>${DV.ui.badge(l.mode === 1 ? 'Async' : 'Sync', 'muted')}</td>
          <td style="font-weight:600;color:${dur > 1000 ? 'var(--warn-color)' : 'inherit'};">${dur} ms</td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('tr[data-id]').forEach(tr => tr.addEventListener('click', () => openDetail(tr.dataset.id)));
    }

    function openDetail(id) {
      selectedLog = logs.find(l => l.plugintracelogid === id);
      if (!selectedLog) return;
      renderTable();
      const l = selectedLog;
      document.getElementById('detail-pane').classList.add('open');
      document.getElementById('detail-body').innerHTML = `
        <div style="font-size:12px;line-height:1.6;">
          <div><strong>Plugin:</strong> <code>${DV.esc(l.typename || '—')}</code></div>
          <div><strong>Message / Entity:</strong> <code>${DV.esc(l.messagename || '—')}</code> on <code>${DV.esc(l.primaryentity || 'none')}</code></div>
          <div><strong>Mode / Depth:</strong> ${l.mode === 1 ? 'Async' : 'Sync'} · ${l.operationtype === 2 ? 'Workflow Activity' : 'Plugin'} · Depth ${l.depth ?? 1}</div>
          <div><strong>Duration:</strong> ${l.performanceexecutionduration ?? 0} ms</div>
          <div><strong>Correlation ID:</strong> <code>${DV.esc(l.correlationid || '—')}</code></div>
          <div><strong>Created:</strong> ${l.createdon ? new Date(l.createdon).toLocaleString() : '—'}</div>
        </div>
        ${l.exceptiondetails ? `<div><strong style="font-size:11px;color:var(--err-color);">Exception Stack Trace</strong><div class="dv-code err" style="max-height:220px;">${DV.esc(l.exceptiondetails)}</div></div>` : ''}
        <div><strong style="font-size:11px;color:var(--text-sec);">ITracingService Message Block</strong><div class="dv-code" style="max-height:220px;">${DV.esc(l.messageblock || '(empty)')}</div></div>
        ${l.configuration ? `<div><strong style="font-size:11px;color:var(--text-sec);">Unsecure Configuration</strong><div class="dv-code">${DV.esc(l.configuration)}</div></div>` : ''}
      `;
    }

    ['f-range', 'f-mode', 'f-errors', 'f-corr'].forEach(id => document.getElementById(id).addEventListener('change', fetchLogs));
    ['f-search', 'f-mindur'].forEach(id => document.getElementById(id).addEventListener('input', renderTable));
    document.getElementById('btn-refresh').addEventListener('click', fetchLogs);
    document.getElementById('btn-clear-corr').addEventListener('click', () => { document.getElementById('f-corr').value = ''; fetchLogs(); });
    document.getElementById('btn-filter-corr').addEventListener('click', () => { if (selectedLog?.correlationid) { document.getElementById('f-corr').value = selectedLog.correlationid; fetchLogs(); } });
    document.getElementById('btn-close-detail').addEventListener('click', () => { document.getElementById('detail-pane').classList.remove('open'); selectedLog = null; renderTable(); });
    document.getElementById('btn-copy-report').addEventListener('click', () => {
      if (!selectedLog) return;
      const l = selectedLog;
      DV.copyText(`### Dataverse Plugin Trace\n- **Plugin:** \`${l.typename}\`\n- **Message/Entity:** \`${l.messagename}\` / \`${l.primaryentity}\`\n- **Depth:** ${l.depth} | **Duration:** ${l.performanceexecutionduration} ms\n- **Correlation ID:** \`${l.correlationid}\`\n\n#### Exception\n\`\`\`\n${l.exceptiondetails || 'None'}\n\`\`\`\n\n#### Trace Output\n\`\`\`\n${l.messageblock || 'None'}\n\`\`\``, 'Markdown trace report copied');
    });
    document.getElementById('auto-poll').addEventListener('change', e => {
      clearInterval(pollTimer);
      const ms = Number(e.target.value);
      document.getElementById('live-dot').classList.toggle('live', ms > 0);
      if (ms > 0) pollTimer = setInterval(fetchLogs, ms);
    });
    document.getElementById('btn-export').addEventListener('click', () => {
      const rows = getFilteredLogs(); if (!rows.length) return;
      DV.exportCsv(`plugin_traces_${new Date().toISOString().slice(0, 10)}.csv`,
        ['CreatedOn', 'TypeName', 'MessageName', 'PrimaryEntity', 'Depth', 'Mode', 'DurationMs', 'CorrelationId', 'ExceptionDetails', 'MessageBlock'],
        rows.map(l => [l.createdon, l.typename, l.messagename, l.primaryentity, l.depth, l.mode === 1 ? 'Async' : 'Sync', l.performanceexecutionduration, l.correlationid, l.exceptiondetails || '', l.messageblock || '']));
    });
  </script>
</body>
</html>
