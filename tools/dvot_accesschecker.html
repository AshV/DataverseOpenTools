<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access &amp; Privilege Diagnostics</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "access-checker",
    "name":           "Access Diagnostics",
    "version":        "1.1.0",
    "description":    "Diagnose effective record permissions via RetrievePrincipalAccess and inspect Security Roles, Team memberships, and record ownership.",
    "icon":           "🛡️",
    "category":       "Security",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>

  <style>
    .ac-setup { padding: 12px 16px; background: var(--bg-alt); border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; flex-shrink: 0; }
    .ac-setup input, .ac-setup select { width: 100%; }
    .ac-rights { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .ac-tile { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-weight: 600; }
    .ac-tile.ok { background: var(--ok-bg); color: var(--ok-color); border-color: var(--ok-color); }
    .ac-tile.no { background: var(--err-bg); color: var(--err-color); border-color: var(--err-color); opacity: .8; }
    .ac-two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  </style>
</head>
<body class="dv-app">

  <div class="ac-setup">
    <div class="dv-field">
      <label>Principal (<select id="principal-type" style="width:auto;padding:1px 4px;font-size:10px;"><option value="systemuser">User</option><option value="team">Team</option></select>)</label>
      <input type="text" id="principal-filter" placeholder="Filter users/teams…" style="margin-bottom:4px;">
      <select id="principal-select"></select>
    </div>

    <div class="dv-field">
      <label>Target Table</label>
      <input type="text" id="entity-filter" placeholder="Filter table…" style="margin-bottom:4px;">
      <select id="entity-select"></select>
    </div>

    <div class="dv-field">
      <label>Target Record GUID <button class="dv-btn dv-btn-sm" id="btn-pick-sample" style="float:right;padding:1px 6px;">Pick Recent</button></label>
      <select id="recent-records" style="margin-bottom:4px;display:none;"></select>
      <input type="text" id="record-guid" placeholder="00000000-0000-0000-0000-000000000000" style="font-family:monospace;">
    </div>

    <div>
      <button class="dv-btn dv-btn-primary" id="btn-check" disabled style="height:34px;">🛡️ Check Access</button>
    </div>
  </div>

  <div class="dv-scroll dv-pad" id="results-area">
    <div class="dv-empty">Choose a <strong>User or Team</strong>, select a <strong>Table</strong> and <strong>Record GUID</strong> (or click <em>Pick Recent</em>), then click <strong>Check Access</strong>.</div>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Uses Microsoft.Dynamics.CRM.RetrievePrincipalAccess</span>
    <div class="dv-spacer"></div>
    <span id="tel-user">—</span>
  </footer>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let context = null, users = [], teams = [], entities = [];

    window.parent?.postMessage({ source: 'dvopentools-tool', type: 'TOOL_READY', payload: {} }, HOST_ORIGIN);
    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      if (e.data.type === 'CONTEXT_INIT') { context = e.data.payload; onContextReady(); }
      if (e.data.type === 'TOOL_LAUNCH' && e.data.payload) applyLaunch(e.data.payload);
    });

    function applyLaunch(p) {
      if (p.logicalName && entities.some(e => e.logicalName === p.logicalName)) document.getElementById('entity-select').value = p.logicalName;
      if (p.recordId) document.getElementById('record-guid').value = p.recordId;
    }

    async function onContextReady() {
      document.getElementById('tel-user').textContent = context.userName || '';
      const [uRes, tRes, eRes] = await Promise.allSettled([
        DV.fetch('/systemusers?$select=systemuserid,fullname,internalemailaddress,_businessunitid_value,isdisabled&$filter=isdisabled eq false&$orderby=fullname asc&$top=500'),
        DV.fetch('/teams?$select=teamid,name,teamtype,_businessunitid_value&$orderby=name asc&$top=500'),
        DV.fetch('/EntityDefinitions?$select=LogicalName,EntitySetName,DisplayName,PrimaryIdAttribute,PrimaryNameAttribute,OwnershipType&$filter=IsIntersect eq false')
      ]);
      if (uRes.status === 'fulfilled') users = uRes.value.value || [];
      if (tRes.status === 'fulfilled') teams = tRes.value.value || [];
      if (eRes.status === 'fulfilled') {
        entities = (eRes.value.value || []).filter(e => e.EntitySetName && e.PrimaryIdAttribute).map(e => ({
          logicalName: e.LogicalName, entitySetName: e.EntitySetName,
          displayName: e.DisplayName?.UserLocalizedLabel?.Label || e.LogicalName,
          primaryId: e.PrimaryIdAttribute, primaryName: e.PrimaryNameAttribute || '',
          ownership: e.OwnershipType || 'UserOwned'
        })).sort((a, b) => a.displayName.localeCompare(b.displayName));
      }
      renderPrincipalSelect();
      renderEntitySelect();
      if (context.launchData) applyLaunch(context.launchData);
      document.getElementById('btn-check').disabled = false;
    }

    function renderPrincipalSelect() {
      const kind = document.getElementById('principal-type').value;
      const q = document.getElementById('principal-filter').value.trim().toLowerCase();
      const items = kind === 'systemuser'
        ? users.filter(u => !q || `${u.fullname} ${u.internalemailaddress || ''}`.toLowerCase().includes(q))
        : teams.filter(t => !q || (t.name || '').toLowerCase().includes(q));
      document.getElementById('principal-select').innerHTML = items.map(item => {
        const id = kind === 'systemuser' ? item.systemuserid : item.teamid;
        const lbl = kind === 'systemuser' ? `${item.fullname}${item.internalemailaddress ? ' (' + item.internalemailaddress + ')' : ''}`
          : `${item.name} [${item['teamtype@OData.Community.Display.V1.FormattedValue'] || item.teamtype}]`;
        return `<option value="${DV.esc(id)}">${DV.esc(lbl)}</option>`;
      }).join('') || '<option value="">No matches</option>';
    }

    function renderEntitySelect() {
      const q = document.getElementById('entity-filter').value.trim().toLowerCase();
      const sel = document.getElementById('entity-select');
      const list = entities.filter(e => !q || e.displayName.toLowerCase().includes(q) || e.logicalName.toLowerCase().includes(q));
      sel.innerHTML = list.map(e => `<option value="${DV.esc(e.logicalName)}">${DV.esc(e.displayName)} (${DV.esc(e.logicalName)})</option>`).join('');
      if (list.some(e => e.logicalName === 'account') && !q) sel.value = 'account';
    }

    async function pickRecentRecords() {
      const ent = entities.find(e => e.logicalName === document.getElementById('entity-select').value);
      if (!ent) return;
      try {
        const rows = (await DV.fetch(`/${ent.entitySetName}?$select=${[ent.primaryId, ent.primaryName].filter(Boolean).join(',')}&$top=20`)).value || [];
        if (!rows.length) { DV.notify(`No records found in ${ent.logicalName}`, 'warning'); return; }
        const sel = document.getElementById('recent-records');
        sel.style.display = 'block';
        sel.innerHTML = '<option value="">Choose a recent record…</option>' + rows.map(r => {
          const id = r[ent.primaryId];
          return `<option value="${DV.esc(id)}">${DV.esc(ent.primaryName ? (r[ent.primaryName] || id) : id)} (${DV.esc(id.slice(0, 8))}…)</option>`;
        }).join('');
      } catch (err) { DV.notify(err.message, 'error'); }
    }

    async function checkAccess() {
      const kind = document.getElementById('principal-type').value;
      const principalId = document.getElementById('principal-select').value;
      const ent = entities.find(e => e.logicalName === document.getElementById('entity-select').value);
      const recordId = document.getElementById('record-guid').value.trim().replace(/[{}]/g, '');
      if (!principalId || !ent || !recordId) { DV.notify('Select principal, table, and enter a valid record GUID.', 'warning'); return; }

      const area = document.getElementById('results-area');
      area.innerHTML = DV.ui.empty('Running access diagnostics…');

      try {
        const pSet = kind === 'systemuser' ? 'systemusers' : 'teams';
        const targetJson = encodeURIComponent(JSON.stringify({ '@odata.id': `${ent.entitySetName}(${recordId})` }));
        const ownerSelect = [ent.primaryId, ent.primaryName].filter(Boolean);
        if (ent.ownership !== 'OrganizationOwned') ownerSelect.push('_ownerid_value', '_owningbusinessunit_value');

        const [accessRes, recRes, rolesRes, teamsRes, poaRes] = await Promise.allSettled([
          DV.fetch(`/${pSet}(${principalId})/Microsoft.Dynamics.CRM.RetrievePrincipalAccess(Target=@tid)?@tid=${targetJson}`),
          DV.fetch(`/${ent.entitySetName}(${recordId})?$select=${ownerSelect.join(',')}`),
          DV.fetch(`/${pSet}(${principalId})/${kind === 'systemuser' ? 'systemuserroles_association' : 'teamroles_association'}?$select=roleid,name,_businessunitid_value`),
          kind === 'systemuser' ? DV.fetch(`/systemusers(${principalId})/teammembership_association?$select=teamid,name,teamtype&$expand=teamroles_association($select=roleid,name)`) : Promise.resolve({ value: [] }),
          DV.fetch(`/principalobjectaccessset?$filter=objectid eq ${recordId}&$select=principalid,principaltypecode,accessrightsmask,inheritedaccessrightsmask`).catch(() => ({ value: [] }))
        ]);

        if (accessRes.status === 'rejected') throw new Error(accessRes.reason.message);
        const rawMask = String(accessRes.value?.AccessRights || 'None');
        const grantedList = rawMask.split(',').map(s => s.trim()).filter(Boolean);
        const allRights = ['ReadAccess', 'WriteAccess', 'AppendAccess', 'AppendToAccess', 'DeleteAccess', 'ShareAccess', 'AssignAccess'];
        const rec = recRes.status === 'fulfilled' ? recRes.value : null;
        const directRoles = rolesRes.status === 'fulfilled' ? (rolesRes.value.value || []) : [];
        const memberTeams = teamsRes.status === 'fulfilled' ? (teamsRes.value.value || []) : [];
        const poaRows = poaRes.status === 'fulfilled' ? (poaRes.value.value || []) : [];
        const isOwner = rec && rec._ownerid_value && rec._ownerid_value.toLowerCase() === principalId.toLowerCase();

        DV.setTitle(`Access — ${ent.logicalName}`);
        area.innerHTML = `
          <div class="dv-card">
            <div class="dv-card-hdr"><span>Effective Access Rights (<code>RetrievePrincipalAccess</code>)</span><span style="font-size:11px;color:var(--text-sec);">Mask: <code>${DV.esc(rawMask)}</code></span></div>
            <div class="dv-card-body"><div class="ac-rights">
              ${allRights.map(r => {
                const ok = grantedList.includes(r);
                return `<div class="ac-tile ${ok ? 'ok' : 'no'}"><span>${r.replace('Access', '')}</span><span>${ok ? '✔ Allowed' : '✕ Denied'}</span></div>`;
              }).join('')}
            </div></div>
          </div>
          <div class="dv-card">
            <div class="dv-card-hdr">Record Context &amp; Ownership</div>
            <div class="dv-card-body">
              ${rec ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
                <div><strong>Record:</strong> ${DV.esc(ent.primaryName ? (rec[ent.primaryName] || recordId) : recordId)}</div>
                <div><strong>Owner:</strong> ${DV.esc(rec['_ownerid_value@OData.Community.Display.V1.FormattedValue'] || rec._ownerid_value || 'Organization Owned')} ${isOwner ? '<strong style="color:var(--ok-color);">(Principal IS Owner)</strong>' : ''}</div>
                <div><strong>Owning BU:</strong> ${DV.esc(rec['_owningbusinessunit_value@OData.Community.Display.V1.FormattedValue'] || rec._owningbusinessunit_value || '—')}</div>
              </div>` : '<span style="color:var(--err-color);">Could not read target record details.</span>'}
            </div>
          </div>
          <div class="ac-two">
            <div class="dv-card">
              <div class="dv-card-hdr">Direct Security Roles (${directRoles.length})</div>
              <div class="dv-card-body" style="padding:0;">${directRoles.length ? `<table class="dv-table"><thead><tr><th>Role Name</th><th>Business Unit</th></tr></thead><tbody>
                ${directRoles.map(r => `<tr><td><strong>${DV.esc(r.name)}</strong></td><td>${DV.esc(r['_businessunitid_value@OData.Community.Display.V1.FormattedValue'] || '—')}</td></tr>`).join('')}
              </tbody></table>` : '<div style="padding:12px;color:var(--text-sec);">No direct security roles assigned.</div>'}</div>
            </div>
            <div class="dv-card">
              <div class="dv-card-hdr">Team Memberships &amp; Roles (${memberTeams.length})</div>
              <div class="dv-card-body" style="padding:0;">${memberTeams.length ? `<table class="dv-table"><thead><tr><th>Team</th><th>Team Roles</th></tr></thead><tbody>
                ${memberTeams.map(t => `<tr><td><strong>${DV.esc(t.name)}</strong></td><td>${DV.esc((t.teamroles_association || []).map(r => r.name).join(', ') || 'None')}</td></tr>`).join('')}
              </tbody></table>` : '<div style="padding:12px;color:var(--text-sec);">No team memberships.</div>'}</div>
            </div>
          </div>
          <div class="dv-card">
            <div class="dv-card-hdr">Explicit Record Shares (PrincipalObjectAccess: ${poaRows.length})</div>
            <div class="dv-card-body" style="padding:0;">${poaRows.length ? `<table class="dv-table"><thead><tr><th>Principal ID</th><th>Type</th><th>Access Mask</th><th>Inherited Mask</th></tr></thead><tbody>
              ${poaRows.map(p => `<tr><td><code>${DV.esc(p.principalid)}</code></td><td>${DV.esc(p.principaltypecode)}</td><td><code>${p.accessrightsmask}</code></td><td><code>${p.inheritedaccessrightsmask}</code></td></tr>`).join('')}
            </tbody></table>` : '<div style="padding:12px;color:var(--text-sec);">No explicit share entries found on this record.</div>'}</div>
          </div>`;
      } catch (err) {
        area.innerHTML = DV.ui.error(err.message);
        DV.notify(err.message, 'error');
      }
    }

    document.getElementById('principal-type').addEventListener('change', renderPrincipalSelect);
    document.getElementById('principal-filter').addEventListener('input', renderPrincipalSelect);
    document.getElementById('entity-filter').addEventListener('input', renderEntitySelect);
    document.getElementById('btn-pick-sample').addEventListener('click', pickRecentRecords);
    document.getElementById('recent-records').addEventListener('change', e => { if (e.target.value) document.getElementById('record-guid').value = e.target.value; });
    document.getElementById('btn-check').addEventListener('click', checkAccess);
  </script>
</body>
</html>
