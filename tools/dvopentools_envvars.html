<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Environment Variables &amp; Config Inspector</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "env-vars",
    "name":           "Environment Variables",
    "version":        "1.1.0",
    "description":    "Inspect Default vs Current Environment Variable values, validate JSON configs, spot missing values, and safely update overrides.",
    "icon":           "⚙️",
    "category":       "Configuration",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>
</head>
<body class="dv-app">

  <div class="dv-toolbar">
    <input type="text" id="f-search" placeholder="Filter schema name, display name, value…" style="width:260px;">
    <select id="f-type">
      <option value="ALL">All Types</option>
      <option value="100000000">String</option><option value="100000001">Number</option>
      <option value="100000002">Boolean</option><option value="100000003">JSON</option>
      <option value="100000004">Data Source</option><option value="100000005">Secret</option>
    </select>
    <select id="f-status">
      <option value="ALL">All States</option>
      <option value="OVERRIDDEN">Has Current Value</option>
      <option value="DEFAULT_ONLY">Using Default Only</option>
      <option value="MISSING">Missing Both Values</option>
      <option value="INVALID_JSON">Invalid JSON</option>
    </select>
    <div class="dv-spacer"></div>
    <button class="dv-btn dv-btn-primary" id="btn-refresh">↻ Refresh</button>
    <button class="dv-btn" id="btn-export-json">📥 Export JSON</button>
    <button class="dv-btn" id="btn-export-csv">📥 Export CSV</button>
  </div>

  <div class="dv-strip">
    <span>Total Definitions: <strong id="st-total">0</strong></span>
    <span>Overridden: <strong id="st-over">0</strong></span>
    <span>Missing Required: <strong id="st-miss" style="color:var(--err-color);">0</strong></span>
    <span>JSON Errors: <strong id="st-jerr" style="color:var(--warn-color);">0</strong></span>
  </div>

  <div class="dv-scroll">
    <table class="dv-table">
      <thead><tr><th>Variable (Display / Schema)</th><th>Type</th><th>Status</th><th>Default Value</th><th>Current Value (Env Override)</th><th style="width:90px;">Action</th></tr></thead>
      <tbody id="env-tbody"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-sec);">Connecting to Dataverse…</td></tr></tbody>
    </table>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Environment Variables Inspector</span>
    <div class="dv-spacer"></div>
    <span>Edits are guarded by Host Safe Mode / Zero Trust</span>
  </footer>

  <div class="dv-overlay" id="edit-modal">
    <div class="dv-modal">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong id="edit-title">Edit Current Value</strong>
        <button class="dv-btn dv-btn-sm" id="edit-close">✕</button>
      </div>
      <div style="font-size:11px;color:var(--text-sec);" id="edit-schema"></div>
      <div id="edit-default-info" class="dv-code"></div>
      <textarea id="edit-val-input" rows="6" style="width:100%;font-family:monospace;" placeholder="Enter new current value…"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="dv-btn" id="edit-cancel">Cancel</button>
        <button class="dv-btn dv-btn-primary" id="edit-save">Save Current Value</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    const TYPE_LABELS = { 100000000: 'String', 100000001: 'Number', 100000002: 'Boolean', 100000003: 'JSON', 100000004: 'Data Source', 100000005: 'Secret' };
    let items = [], editingItem = null;

    window.parent?.postMessage({ source: 'dvopentools-tool', type: 'TOOL_READY', payload: {} }, HOST_ORIGIN);
    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      if (e.data.type === 'CONTEXT_INIT') loadEnvVars();
    });

    async function loadEnvVars() {
      try {
        const [defsRes, valsRes] = await Promise.all([
          DV.fetch('/environmentvariabledefinitions?$select=environmentvariabledefinitionid,schemaname,displayname,description,type,defaultvalue,isrequired,secretstore&$orderby=displayname asc'),
          DV.fetch('/environmentvariablevalues?$select=environmentvariablevalueid,value,_environmentvariabledefinitionid_value,schemaname')
        ]);
        const valByDef = new Map((valsRes.value || []).filter(v => v._environmentvariabledefinitionid_value).map(v => [v._environmentvariabledefinitionid_value, v]));

        items = (defsRes.value || []).map(d => {
          const valRec = valByDef.get(d.environmentvariabledefinitionid);
          const effective = valRec?.value ?? d.defaultvalue ?? '';
          let jsonInvalid = false;
          if (d.type === 100000003 && effective) { try { JSON.parse(effective); } catch { jsonInvalid = true; } }
          const isOverridden = valRec !== undefined && valRec.value !== null && valRec.value !== '';
          return {
            defId: d.environmentvariabledefinitionid, valId: valRec?.environmentvariablevalueid || null,
            schemaName: d.schemaname, displayName: d.displayname || d.schemaname, description: d.description || '',
            type: d.type, typeLabel: TYPE_LABELS[d.type] || String(d.type), defaultValue: d.defaultvalue ?? '',
            currentValue: valRec?.value ?? '', isRequired: !!d.isrequired, isSecret: d.type === 100000005,
            isOverridden, isMissing: !isOverridden && (d.defaultvalue === null || d.defaultvalue === undefined || d.defaultvalue === ''), jsonInvalid
          };
        });
        renderTable();
      } catch (err) {
        document.getElementById('env-tbody').innerHTML = `<tr><td colspan="6" style="color:var(--err-color);padding:20px;">❌ ${DV.esc(err.message)}</td></tr>`;
        DV.notify(err.message, 'error');
      }
    }

    function getFiltered() {
      const q = document.getElementById('f-search').value.trim().toLowerCase();
      const t = document.getElementById('f-type').value, st = document.getElementById('f-status').value;
      return items.filter(i => (t === 'ALL' || String(i.type) === t) &&
        (st === 'ALL' || (st === 'OVERRIDDEN' && i.isOverridden) || (st === 'DEFAULT_ONLY' && !i.isOverridden && !i.isMissing) ||
         (st === 'MISSING' && i.isMissing) || (st === 'INVALID_JSON' && i.jsonInvalid)) &&
        (!q || `${i.displayName} ${i.schemaName} ${i.defaultValue} ${i.currentValue}`.toLowerCase().includes(q)));
    }

    function renderTable() {
      document.getElementById('st-total').textContent = items.length;
      document.getElementById('st-over').textContent = items.filter(i => i.isOverridden).length;
      document.getElementById('st-miss').textContent = items.filter(i => i.isRequired && i.isMissing).length;
      document.getElementById('st-jerr').textContent = items.filter(i => i.jsonInvalid).length;
      DV.setTitle(`Env Vars (${items.length})`);

      const rows = getFiltered(), tbody = document.getElementById('env-tbody');
      if (!rows.length) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--text-sec);">No environment variables match the current filter.</td></tr>'; return; }

      tbody.innerHTML = rows.map(i => {
        const badge = i.jsonInvalid ? DV.ui.badge('Invalid JSON', 'err')
          : (i.isMissing && i.isRequired) ? DV.ui.badge('Missing Required', 'err')
          : i.isMissing ? DV.ui.badge('Unset', 'warn')
          : i.isOverridden ? DV.ui.badge('Overridden', 'ok') : DV.ui.badge('Default', 'info');
        const box = v => `<div class="dv-code" style="max-width:270px;max-height:80px;padding:4px 6px;">${DV.esc(i.isSecret ? '•••••••• (Secret Ref)' : v)}</div>`;
        return `<tr>
          <td><strong>${DV.esc(i.displayName)}</strong> ${i.isRequired ? '<span style="color:var(--err-color);">*</span>' : ''}<br><code>${DV.esc(i.schemaName)}</code>${i.description ? `<div style="font-size:11px;color:var(--text-sec);margin-top:2px;">${DV.esc(i.description)}</div>` : ''}</td>
          <td><code>${DV.esc(i.typeLabel)}</code></td><td>${badge}</td>
          <td>${i.defaultValue ? box(i.defaultValue) : '<span style="color:var(--text-muted)">—</span>'}</td>
          <td>${i.currentValue ? box(i.currentValue) : '<span style="color:var(--text-muted)">(uses default)</span>'}</td>
          <td><button class="dv-btn dv-btn-sm" data-edit="${DV.esc(i.defId)}" ${i.isSecret ? 'disabled title="Managed via Key Vault"' : ''}>✏️ Edit</button></td>
        </tr>`;
      }).join('');
      tbody.querySelectorAll('[data-edit]').forEach(btn => btn.addEventListener('click', () => {
        editingItem = items.find(i => i.defId === btn.dataset.edit); if (!editingItem) return;
        document.getElementById('edit-title').textContent = `Edit: ${editingItem.displayName}`;
        document.getElementById('edit-schema').textContent = `${editingItem.schemaName} (${editingItem.typeLabel})`;
        document.getElementById('edit-default-info').textContent = `Default Value: ${editingItem.defaultValue || '(none)'}`;
        document.getElementById('edit-val-input').value = editingItem.currentValue;
        document.getElementById('edit-modal').classList.add('open');
      }));
    }

    async function saveCurrentValue() {
      if (!editingItem) return;
      const newVal = document.getElementById('edit-val-input').value;
      if (editingItem.type === 100000003 && newVal.trim()) {
        try { JSON.parse(newVal); } catch { DV.notify('Value must be valid JSON.', 'warning'); return; }
      }
      const btn = document.getElementById('edit-save');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        if (editingItem.valId) await DV.fetch(`/environmentvariablevalues(${editingItem.valId})`, { method: 'PATCH', body: JSON.stringify({ value: newVal }) });
        else await DV.fetch('/environmentvariablevalues', { method: 'POST', body: JSON.stringify({ schemaname: editingItem.schemaName + '_val', value: newVal, 'EnvironmentVariableDefinitionId@odata.bind': `/environmentvariabledefinitions(${editingItem.defId})` }) });
        document.getElementById('edit-modal').classList.remove('open');
        DV.notify(`Updated ${editingItem.schemaName}`, 'success');
        await loadEnvVars();
      } catch (err) { DV.notify(err.message, 'error'); }
      finally { btn.disabled = false; btn.textContent = 'Save Current Value'; }
    }

    ['f-search', 'f-type', 'f-status'].forEach(id => { document.getElementById(id).addEventListener('input', renderTable); document.getElementById(id).addEventListener('change', renderTable); });
    document.getElementById('btn-refresh').addEventListener('click', loadEnvVars);
    ['edit-close', 'edit-cancel'].forEach(id => document.getElementById(id).addEventListener('click', () => document.getElementById('edit-modal').classList.remove('open')));
    document.getElementById('edit-save').addEventListener('click', saveCurrentValue);
    document.getElementById('btn-export-json').addEventListener('click', () => {
      DV.exportJson(`env_vars_${new Date().toISOString().slice(0, 10)}.json`, getFiltered().map(i => ({ schemaName: i.schemaName, displayName: i.displayName, type: i.typeLabel, defaultValue: i.isSecret ? '[SECRET]' : i.defaultValue, currentValue: i.isSecret ? '[SECRET]' : i.currentValue })));
    });
    document.getElementById('btn-export-csv').addEventListener('click', () => {
      DV.exportCsv(`env_vars_${new Date().toISOString().slice(0, 10)}.csv`, ['SchemaName', 'DisplayName', 'Type', 'Required', 'DefaultValue', 'CurrentValue'],
        getFiltered().map(i => [i.schemaName, i.displayName, i.typeLabel, i.isRequired, i.isSecret ? '[SECRET]' : i.defaultValue, i.isSecret ? '[SECRET]' : i.currentValue]));
    });
  </script>
</body>
</html>
