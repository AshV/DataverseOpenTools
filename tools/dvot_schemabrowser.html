<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metadata &amp; Schema Browser</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "schema-browser",
    "name":           "Schema Browser",
    "version":        "1.1.0",
    "description":    "Explore Dataverse EntityDefinitions, columns, OptionSet integer mappings, relationships, keys, and Global Option Sets.",
    "icon":           "📖",
    "category":       "Metadata",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>

  <style>
    .sb-opt-box { margin-top: 6px; padding: 6px 8px; background: var(--bg-alt); border: 1px solid var(--border); border-radius: 4px; font-size: 11px; }
    .sb-opt-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; border-bottom: 1px dashed var(--border-subtle); }
    .sb-opt-row:last-child { border-bottom: none; }
  </style>
</head>
<body class="dv-app">

  <div class="dv-split">
    <aside class="dv-pane-left" style="width:300px;">
      <div class="dv-toolbar" style="flex-direction:column;align-items:stretch;gap:7px;">
        <div style="display:flex;gap:6px;">
          <input type="text" id="entity-search" placeholder="Search tables / OTC…" style="flex:1;">
          <button class="dv-btn" id="btn-refresh" title="Refresh Metadata">↻</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <select id="entity-scope" style="flex:1;">
            <option value="ALL">All Tables</option>
            <option value="CUSTOM">Custom Only</option>
            <option value="STANDARD">Standard Only</option>
            <option value="AUDITED">Audit Enabled</option>
          </select>
          <span id="entity-count" style="font-size:11px;color:var(--text-sec);">0</span>
        </div>
      </div>
      <div class="dv-scroll" id="entity-list">
        <div class="dv-empty">Waiting for context…</div>
      </div>
    </aside>

    <main class="dv-pane-right">
      <div class="dv-toolbar">
        <div>
          <strong id="sel-title" style="font-size:15px;">Select a Table</strong>
          <div id="sel-subtitle" style="font-size:11px;color:var(--text-sec);font-family:monospace;">Choose an entity on the left or inspect Global Option Sets</div>
        </div>
        <div class="dv-spacer"></div>
        <button class="dv-btn dv-btn-primary" id="btn-open-fetchxml" disabled>🔍 Query in FetchXML</button>
        <button class="dv-btn" id="btn-export-cols" disabled>📥 Export Schema CSV</button>
      </div>

      <div class="dv-tabs">
        <button class="dv-tab-btn active" data-tab="columns">Columns &amp; OptionSets</button>
        <button class="dv-tab-btn" data-tab="overview">Overview &amp; Keys</button>
        <button class="dv-tab-btn" data-tab="relationships">Relationships</button>
        <button class="dv-tab-btn" data-tab="globals">Global Option Sets</button>
      </div>

      <div class="dv-strip">
        <input type="text" id="detail-search" placeholder="Filter columns, relationships, or choices…" style="width:260px;">
        <select id="col-type-filter">
          <option value="ALL">All Column Types</option>
          <option value="CUSTOM">Custom Columns Only</option>
          <option value="PICKLIST">OptionSets / Status / Boolean</option>
          <option value="LOOKUP">Lookups</option>
        </select>
        <div class="dv-spacer"></div>
        <span id="detail-stats" style="font-size:11px;color:var(--text-sec);">—</span>
      </div>

      <div class="dv-scroll" id="content-body">
        <div class="dv-empty">Select a Dataverse table from the directory to explore its schema.</div>
      </div>
    </main>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Schema Browser initialized</span>
    <div class="dv-spacer"></div>
    <span id="tel-store">Storage: —</span>
  </footer>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let store = null, entities = [], selectedEntity = null, activeTab = 'columns';
    let entityCache = new Map(), globalOptionSets = null;

    window.parent?.postMessage({ source: 'dvopentools-tool', type: 'TOOL_READY', payload: {} }, HOST_ORIGIN);
    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      if (e.data.type === 'CONTEXT_INIT') onContextReady();
    });

    async function onContextReady() {
      store = DV.store('schema-browser');
      document.getElementById('tel-store').textContent = `Storage: ${store.type}`;
      await loadEntities();
    }

    async function loadEntities(force = false) {
      document.getElementById('entity-list').innerHTML = DV.ui.empty('Loading EntityDefinitions…');
      const cached = !force ? store.get('entities') : null;
      if (cached && Date.now() - cached.ts < 10 * 60000) {
        entities = cached.items; renderEntityList(); return;
      }
      try {
        const data = await DV.fetch('/EntityDefinitions?$select=LogicalName,SchemaName,EntitySetName,DisplayName,PrimaryIdAttribute,PrimaryNameAttribute,ObjectTypeCode,IsCustomEntity,IsActivity,OwnershipType,IsAuditEnabled,ChangeTrackingEnabled');
        entities = (data.value || []).map(e => ({
          logicalName: e.LogicalName, schemaName: e.SchemaName, entitySetName: e.EntitySetName || '',
          displayName: e.DisplayName?.UserLocalizedLabel?.Label || e.LogicalName,
          primaryId: e.PrimaryIdAttribute || '', primaryName: e.PrimaryNameAttribute || '',
          otc: e.ObjectTypeCode, isCustom: !!e.IsCustomEntity, ownership: e.OwnershipType || '—',
          isAudited: !!e.IsAuditEnabled?.Value, changeTracking: !!e.ChangeTrackingEnabled
        })).sort((a, b) => a.displayName.localeCompare(b.displayName));
        store.set('entities', { ts: Date.now(), items: entities });
        renderEntityList();
      } catch (err) {
        document.getElementById('entity-list').innerHTML = DV.ui.error(err.message);
        DV.notify(err.message, 'error');
      }
    }

    function renderEntityList() {
      const q = document.getElementById('entity-search').value.trim().toLowerCase();
      const scope = document.getElementById('entity-scope').value;
      const list = entities.filter(e => {
        if (scope === 'CUSTOM' && !e.isCustom) return false;
        if (scope === 'STANDARD' && e.isCustom) return false;
        if (scope === 'AUDITED' && !e.isAudited) return false;
        return !q || e.displayName.toLowerCase().includes(q) || e.logicalName.toLowerCase().includes(q) || String(e.otc).includes(q);
      });

      document.getElementById('entity-count').textContent = `${list.length}`;
      const el = document.getElementById('entity-list');
      if (!list.length) { el.innerHTML = DV.ui.empty('No matching tables.'); return; }

      el.innerHTML = list.map(e => `
        <div class="dv-list-item${selectedEntity?.logicalName === e.logicalName ? ' active' : ''}" data-ln="${DV.esc(e.logicalName)}">
          <div style="font-weight:600;display:flex;justify-content:space-between;gap:6px;">
            <span>${DV.esc(e.displayName)}</span>
            ${DV.ui.badge(`${e.isCustom ? 'Custom' : 'Std'} · ${e.otc}`, e.isCustom ? 'info' : 'muted')}
          </div>
          <div style="font-size:11px;color:var(--text-sec);font-family:monospace;">${DV.esc(e.logicalName)}</div>
        </div>
      `).join('');
      el.querySelectorAll('.dv-list-item').forEach(node => node.addEventListener('click', () => selectEntity(node.dataset.ln)));
    }

    async function selectEntity(logicalName) {
      selectedEntity = entities.find(e => e.logicalName === logicalName) || null;
      if (!selectedEntity) return;
      renderEntityList();

      document.getElementById('sel-title').textContent = selectedEntity.displayName;
      document.getElementById('sel-subtitle').textContent = `${selectedEntity.logicalName} | Set: ${selectedEntity.entitySetName || '—'} | OTC: ${selectedEntity.otc}`;
      document.getElementById('btn-open-fetchxml').disabled = false;
      document.getElementById('btn-export-cols').disabled = false;
      DV.setTitle(`Schema — ${selectedEntity.logicalName}`);

      if (!entityCache.has(logicalName)) {
        document.getElementById('content-body').innerHTML = DV.ui.empty('Loading schema metadata…');
        await loadEntityDetails(logicalName);
      }
      renderActiveTab();
    }

    async function loadEntityDetails(logicalName) {
      const detail = { attributes: [], optionMaps: new Map(), oneToMany: [], manyToOne: [], manyToMany: [], keys: [] };
      const enc = encodeURIComponent(logicalName);
      const res = await Promise.allSettled([
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes?$select=LogicalName,SchemaName,DisplayName,AttributeType,IsCustomAttribute,RequiredLevel,Description`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes/Microsoft.Dynamics.CRM.PicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes/Microsoft.Dynamics.CRM.StateAttributeMetadata?$select=LogicalName&$expand=OptionSet`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes/Microsoft.Dynamics.CRM.StatusAttributeMetadata?$select=LogicalName&$expand=OptionSet`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes/Microsoft.Dynamics.CRM.BooleanAttributeMetadata?$select=LogicalName&$expand=OptionSet`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Attributes/Microsoft.Dynamics.CRM.MultiSelectPicklistAttributeMetadata?$select=LogicalName&$expand=OptionSet`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/OneToManyRelationships?$select=SchemaName,ReferencedEntity,ReferencingEntity,ReferencingAttribute`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/ManyToOneRelationships?$select=SchemaName,ReferencedEntity,ReferencingEntity,ReferencingAttribute`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/ManyToManyRelationships?$select=SchemaName,Entity1LogicalName,Entity2LogicalName,IntersectEntityName`),
        DV.fetch(`/EntityDefinitions(LogicalName='${enc}')/Keys?$select=LogicalName,DisplayName,KeyAttributes`)
      ]);

      if (res[0].status === 'fulfilled') detail.attributes = (res[0].value.value || []).sort((a, b) => a.LogicalName.localeCompare(b.LogicalName));
      [1, 2, 3, 5].forEach(i => {
        if (res[i].status === 'fulfilled') {
          for (const attr of (res[i].value.value || [])) {
            const opts = (attr.OptionSet?.Options || []).map(o => ({ value: o.Value, label: o.Label?.UserLocalizedLabel?.Label || String(o.Value) }));
            if (opts.length) detail.optionMaps.set(attr.LogicalName, opts);
          }
        }
      });
      if (res[4].status === 'fulfilled') {
        for (const attr of (res[4].value.value || [])) {
          const os = attr.OptionSet;
          if (os) detail.optionMaps.set(attr.LogicalName, [
            { value: os.FalseOption?.Value ?? 0, label: os.FalseOption?.Label?.UserLocalizedLabel?.Label || 'No' },
            { value: os.TrueOption?.Value ?? 1, label: os.TrueOption?.Label?.UserLocalizedLabel?.Label || 'Yes' }
          ]);
        }
      }
      if (res[6].status === 'fulfilled') detail.oneToMany = res[6].value.value || [];
      if (res[7].status === 'fulfilled') detail.manyToOne = res[7].value.value || [];
      if (res[8].status === 'fulfilled') detail.manyToMany = res[8].value.value || [];
      if (res[9].status === 'fulfilled') detail.keys = res[9].value.value || [];
      entityCache.set(logicalName, detail);
    }

    async function renderActiveTab() {
      const body = document.getElementById('content-body');
      const q = document.getElementById('detail-search').value.trim().toLowerCase();
      const colFilter = document.getElementById('col-type-filter').value;
      document.getElementById('col-type-filter').style.display = activeTab === 'columns' ? 'inline-block' : 'none';

      if (activeTab === 'globals') {
        if (!globalOptionSets) {
          body.innerHTML = DV.ui.empty('Loading GlobalOptionSetDefinitions…');
          try { globalOptionSets = ((await DV.fetch('/GlobalOptionSetDefinitions')).value || []).sort((a, b) => (a.Name || '').localeCompare(b.Name || '')); }
          catch (err) { body.innerHTML = DV.ui.error(err.message); return; }
        }
        const filtered = globalOptionSets.filter(g => !q || `${g.Name} ${g.DisplayName?.UserLocalizedLabel?.Label || ''} ${(g.Options || []).map(o => `${o.Value} ${o.Label?.UserLocalizedLabel?.Label || ''}`).join(' ')}`.toLowerCase().includes(q));
        document.getElementById('detail-stats').textContent = `${filtered.length} global choice sets`;
        body.innerHTML = `<table class="dv-table"><thead><tr><th>Name</th><th>Display Name</th><th>Type</th><th>Options (Value → Label)</th></tr></thead><tbody>
          ${filtered.slice(0, 200).map(g => {
            const opts = (g.Options || []).map(o => `<div class="sb-opt-row"><code>${o.Value}</code><span>${DV.esc(o.Label?.UserLocalizedLabel?.Label || '')}</span></div>`).join('');
            return `<tr><td><code>${DV.esc(g.Name)}</code></td><td>${DV.esc(g.DisplayName?.UserLocalizedLabel?.Label || '—')}</td><td>${DV.esc(g.OptionSetType || 'Picklist')}</td><td>${opts ? `<div class="sb-opt-box">${opts}</div>` : '—'}</td></tr>`;
          }).join('')}</tbody></table>`;
        return;
      }

      if (!selectedEntity) { body.innerHTML = DV.ui.empty('Select a table on the left to inspect its metadata.'); return; }
      const detail = entityCache.get(selectedEntity.logicalName);
      if (!detail) return;

      if (activeTab === 'overview') {
        const e = selectedEntity;
        document.getElementById('detail-stats').textContent = `${detail.keys.length} alternate keys`;
        body.innerHTML = `<div class="dv-pad">
          <div class="dv-kv-grid">
            <div class="dv-kv-card"><div class="dv-kv-label">Logical Name</div><div class="dv-kv-val"><code>${DV.esc(e.logicalName)}</code></div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Schema Name</div><div class="dv-kv-val"><code>${DV.esc(e.schemaName)}</code></div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">OData EntitySetName</div><div class="dv-kv-val"><code>${DV.esc(e.entitySetName || '—')}</code></div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Object Type Code (OTC)</div><div class="dv-kv-val">${e.otc}</div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Primary ID</div><div class="dv-kv-val"><code>${DV.esc(e.primaryId || '—')}</code></div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Primary Name</div><div class="dv-kv-val"><code>${DV.esc(e.primaryName || '—')}</code></div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Ownership</div><div class="dv-kv-val">${DV.esc(e.ownership)}</div></div>
            <div class="dv-kv-card"><div class="dv-kv-label">Auditing / Sync</div><div class="dv-kv-val">${e.isAudited ? '✅ Audited' : '❌ Off'} / ${e.changeTracking ? '✅ On' : 'Off'}</div></div>
          </div>
          <div class="dv-card"><div class="dv-card-hdr">Alternate Keys (${detail.keys.length})</div><div class="dv-card-body" style="padding:0;">
            ${detail.keys.length ? `<table class="dv-table"><thead><tr><th>Logical Name</th><th>Display Name</th><th>Key Columns</th></tr></thead><tbody>
              ${detail.keys.map(k => `<tr><td><code>${DV.esc(k.LogicalName)}</code></td><td>${DV.esc(k.DisplayName?.UserLocalizedLabel?.Label || '—')}</td><td><code>${DV.esc((k.KeyAttributes || []).join(', '))}</code></td></tr>`).join('')}
            </tbody></table>` : '<div style="padding:12px;color:var(--text-sec);">No alternate keys defined.</div>'}
          </div></div></div>`;
        return;
      }

      if (activeTab === 'relationships') {
        const rels = [
          ...detail.oneToMany.map(r => ({ kind: '1:N', schema: r.SchemaName, target: `${r.ReferencingEntity}.${r.ReferencingAttribute}` })),
          ...detail.manyToOne.map(r => ({ kind: 'N:1', schema: r.SchemaName, target: `${r.ReferencedEntity} (via ${r.ReferencingAttribute})` })),
          ...detail.manyToMany.map(r => ({ kind: 'N:N', schema: r.SchemaName, target: `${r.Entity2LogicalName} (${r.IntersectEntityName})` }))
        ].filter(r => !q || JSON.stringify(r).toLowerCase().includes(q));
        document.getElementById('detail-stats').textContent = `${rels.length} relationships`;
        body.innerHTML = `<table class="dv-table"><thead><tr><th>Kind</th><th>SchemaName</th><th>Target / Intersect</th></tr></thead><tbody>
          ${rels.map(r => `<tr><td>${DV.ui.badge(r.kind, 'info')}</td><td><code>${DV.esc(r.schema)}</code></td><td><code>${DV.esc(r.target)}</code></td></tr>`).join('')}
        </tbody></table>`;
        return;
      }

      const filteredCols = detail.attributes.filter(a => {
        const t = a.AttributeType || '';
        if (colFilter === 'CUSTOM' && !a.IsCustomAttribute) return false;
        if (colFilter === 'PICKLIST' && !['Picklist', 'State', 'Status', 'Boolean', 'Virtual'].includes(t) && !detail.optionMaps.has(a.LogicalName)) return false;
        if (colFilter === 'LOOKUP' && !['Lookup', 'Customer', 'Owner'].includes(t)) return false;
        if (!q) return true;
        const opts = (detail.optionMaps.get(a.LogicalName) || []).map(o => `${o.value} ${o.label}`).join(' ');
        return `${a.LogicalName} ${a.SchemaName || ''} ${a.DisplayName?.UserLocalizedLabel?.Label || ''} ${opts}`.toLowerCase().includes(q);
      });
      document.getElementById('detail-stats').textContent = `${filteredCols.length} / ${detail.attributes.length} columns`;

      body.innerHTML = `<table class="dv-table"><thead><tr><th>Display Name</th><th>Logical / Schema Name</th><th>Type</th><th>Required</th><th>Choices / Description</th></tr></thead><tbody>
        ${filteredCols.map(a => {
          const opts = detail.optionMaps.get(a.LogicalName);
          const desc = a.Description?.UserLocalizedLabel?.Label || '';
          const optHtml = opts ? `<div class="sb-opt-box">${opts.map(o => `<div class="sb-opt-row"><code>${o.value}</code><span>${DV.esc(o.label)}</span></div>`).join('')}</div>` : '';
          return `<tr>
            <td><strong>${DV.esc(a.DisplayName?.UserLocalizedLabel?.Label || '—')}</strong> ${a.IsCustomAttribute ? DV.ui.badge('Custom', 'info') : ''}</td>
            <td><code>${DV.esc(a.LogicalName)}</code><br><span style="font-size:10px;color:var(--text-muted);font-family:monospace;">${DV.esc(a.SchemaName)}</span></td>
            <td><code>${DV.esc(a.AttributeType)}</code></td>
            <td>${DV.esc(a.RequiredLevel?.Value || 'None')}</td>
            <td>${desc ? `<div style="font-size:11px;color:var(--text-sec);margin-bottom:4px;">${DV.esc(desc)}</div>` : ''}${optHtml || (desc ? '' : '—')}</td>
          </tr>`;
        }).join('')}</tbody></table>`;
    }

    document.getElementById('entity-search').addEventListener('input', renderEntityList);
    document.getElementById('entity-scope').addEventListener('change', renderEntityList);
    document.getElementById('btn-refresh').addEventListener('click', () => { entityCache.clear(); globalOptionSets = null; loadEntities(true); });
    document.getElementById('detail-search').addEventListener('input', renderActiveTab);
    document.getElementById('col-type-filter').addEventListener('change', renderActiveTab);

    document.querySelectorAll('.dv-tab-btn').forEach(btn => btn.addEventListener('click', () => {
      activeTab = btn.dataset.tab;
      document.querySelectorAll('.dv-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderActiveTab();
    }));

    document.getElementById('btn-open-fetchxml').addEventListener('click', () => {
      if (!selectedEntity) return;
      const attrs = [selectedEntity.primaryId, selectedEntity.primaryName].filter(Boolean).map(a => `    <attribute name="${a}" />`).join('\n');
      DV.openTool('fetchxml-playground', { fetchXml: `<fetch top="25">\n  <entity name="${selectedEntity.logicalName}">\n${attrs}\n  </entity>\n</fetch>` });
    });

    document.getElementById('btn-export-cols').addEventListener('click', () => {
      if (!selectedEntity) return;
      const detail = entityCache.get(selectedEntity.logicalName); if (!detail) return;
      DV.exportCsv(`${selectedEntity.logicalName}_schema.csv`, ['LogicalName', 'SchemaName', 'DisplayName', 'AttributeType', 'IsCustom', 'RequiredLevel', 'Options'],
        detail.attributes.map(a => [
          a.LogicalName, a.SchemaName, a.DisplayName?.UserLocalizedLabel?.Label || '', a.AttributeType, a.IsCustomAttribute,
          a.RequiredLevel?.Value || '', (detail.optionMaps.get(a.LogicalName) || []).map(o => `${o.value}:${o.label}`).join('; ')
        ]));
    });
  </script>
</body>
</html>
