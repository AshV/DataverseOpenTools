<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Resource Manager</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "wr-manager",
    "name":           "Web Resource Manager",
    "version":        "1.0.0",
    "description":    "Browse Dataverse Web Resources in a virtual folder tree, edit code inline or upload local files, preview images/SVGs, compare diffs, add to solutions, publish via PublishXml, and delete.",
    "icon":           "🗂️",
    "category":       "Extensibility",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>

  <style>
    .wrm-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 330px 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .wrm-left {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--bg-card);
      min-height: 0;
    }
    .wrm-filters {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-header);
    }
    .wrm-filter-row { display: flex; gap: 6px; align-items: center; }
    .wrm-filter-row select, .wrm-filter-row input { flex: 1; min-width: 0; }
    .wrm-tree {
      flex: 1;
      overflow: auto;
      padding: 6px 4px;
      font-size: 12px;
      user-select: none;
    }
    .wrm-folder-hdr {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 6px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      color: var(--text);
    }
    .wrm-folder-hdr:hover { background: rgba(0, 120, 212, 0.08); }
    .wrm-caret { width: 12px; display: inline-block; text-align: center; font-size: 10px; color: var(--text-sec); }
    .wrm-folder-children { padding-left: 14px; }
    .wrm-file {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wrm-file:hover { background: rgba(0, 120, 212, 0.08); }
    .wrm-file.active { background: rgba(0, 120, 212, 0.16); color: var(--accent, #0078d4); font-weight: 600; }
    .wrm-file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .wrm-dirty-dot { color: #d97706; font-size: 10px; flex-shrink: 0; }
    .wrm-lock { font-size: 10px; opacity: 0.7; flex-shrink: 0; }

    .wrm-right {
      display: flex;
      flex-direction: column;
      min-height: 0;
      min-width: 0;
      background: var(--bg-main);
    }
    .wrm-meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-header);
      font-size: 12px;
    }
    .wrm-editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    .wrm-editor-wrap.dragover::after {
      content: 'Drop file here to replace Web Resource content';
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent, #0078d4);
      border-radius: 8px;
      background: rgba(0, 120, 212, 0.12);
      display: grid;
      place-items: center;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent, #0078d4);
      pointer-events: none;
    }
    .wrm-textarea {
      flex: 1;
      width: 100%;
      border: none !important;
      border-radius: 0 !important;
      resize: none;
      padding: 12px 14px !important;
      background: var(--code-bg) !important;
      font-family: 'Cascadia Code', 'Consolas', monospace !important;
      font-size: 12.5px;
      line-height: 1.5;
      tab-size: 2;
    }
    .wrm-preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      overflow: auto;
      background-image: linear-gradient(45deg, rgba(128,128,128,0.08) 25%, transparent 25%),
                        linear-gradient(-45deg, rgba(128,128,128,0.08) 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, rgba(128,128,128,0.08) 75%),
                        linear-gradient(-45deg, transparent 75%, rgba(128,128,128,0.08) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .wrm-preview-img {
      max-width: 90%;
      max-height: 60vh;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      padding: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .wrm-diff-pane {
      flex: 1;
      overflow: auto;
      padding: 12px 14px;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .diff-add { background: rgba(16, 185, 129, 0.16); display: block; padding: 0 6px; }
    .diff-del { background: rgba(239, 68, 68, 0.16); display: block; padding: 0 6px; }
    .diff-ctx { color: var(--text-sec); display: block; padding: 0 6px; }
    .wrm-form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .wrm-field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .wrm-field label { font-weight: 600; color: var(--text-sec); }
    @media (max-width: 820px) {
      .wrm-layout { grid-template-columns: 1fr; grid-template-rows: 260px 1fr; }
      .wrm-left { border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body class="dv-app">

  <div class="dv-toolbar">
    <strong>🗂️ Web Resource Manager</strong>
    <button class="dv-btn dv-btn-primary" id="btn-new" disabled>➕ New</button>
    <button class="dv-btn" id="btn-upload-file" disabled>📤 Upload Local File</button>
    <input type="file" id="file-replace-input" style="display:none;">
    <div class="dv-spacer"></div>
    <button class="dv-btn" id="btn-save" disabled>💾 Save</button>
    <button class="dv-btn dv-btn-primary" id="btn-save-publish" disabled>🚀 Save &amp; Publish</button>
    <button class="dv-btn" id="btn-add-sol" disabled>📦 Add to Solution</button>
    <button class="dv-btn" id="btn-download" disabled>⬇️ Download</button>
    <button class="dv-btn" id="btn-delete" style="color:#d13438;" disabled>🗑️ Delete</button>
    <button class="dv-btn" id="btn-sample">🧪 Sample</button>
    <button class="dv-btn" id="btn-refresh" disabled>↻ Reload</button>
  </div>

  <div class="wrm-layout">
    <aside class="wrm-left">
      <div class="wrm-filters">
        <div class="wrm-filter-row">
          <select id="f-solution" title="Filter by Solution">
            <option value="ALL">All Solutions</option>
          </select>
        </div>
        <div class="wrm-filter-row">
          <select id="f-type" title="Filter by Type">
            <option value="ALL">All Types</option>
            <option value="3">JS (.js)</option>
            <option value="1">HTML (.html)</option>
            <option value="2">CSS (.css)</option>
            <option value="4">XML / Data (.xml)</option>
            <option value="11">SVG (.svg)</option>
            <option value="12">ResX (.resx)</option>
            <option value="IMAGES">Images (PNG/JPG/GIF/ICO)</option>
          </select>
          <select id="f-scope" title="Filter Managed / Unmanaged">
            <option value="ALL">All</option>
            <option value="0">Unmanaged</option>
            <option value="1">Managed</option>
          </select>
        </div>
        <div class="wrm-filter-row">
          <input type="text" id="f-search" placeholder="Filter path/name (e.g. new_/)…">
          <button class="dv-btn dv-btn-sm" id="btn-expand-all" title="Expand all folders">⊞</button>
          <button class="dv-btn dv-btn-sm" id="btn-collapse-all" title="Collapse all folders">⊟</button>
        </div>
      </div>
      <div class="dv-strip" style="padding:4px 10px;font-size:11px;">
        <span>Shown: <strong id="st-count">0</strong></span>
        <div class="dv-spacer"></div>
        <span id="st-dirty" style="color:#d97706;font-weight:700;"></span>
      </div>
      <div class="wrm-tree" id="wr-tree">
        <div class="dv-empty">Connecting to Dataverse…</div>
      </div>
    </aside>

    <section class="wrm-right">
      <div class="wrm-meta-bar" id="meta-bar" style="display:none;">
        <span class="dv-badge dv-b-info" id="m-type">—</span>
        <strong id="m-name" style="font-family:monospace;">—</strong>
        <span class="dv-badge" id="m-scope">—</span>
        <input type="text" id="m-displayname" placeholder="Display Name" style="width:190px;" title="Display Name">
        <input type="text" id="m-desc" placeholder="Description…" style="flex:1;min-width:140px;" title="Description">
        <div class="dv-seg-group" id="view-tabs">
          <button class="dv-seg-btn active" data-tab="edit">Editor</button>
          <button class="dv-seg-btn" data-tab="preview">Preview</button>
          <button class="dv-seg-btn" data-tab="diff">Diff vs Server</button>
        </div>
      </div>

      <div class="wrm-editor-wrap" id="editor-dropzone">
        <div class="dv-empty" id="empty-editor">
          Select a Web Resource from the left folder tree to view/edit, or click <strong>➕ New</strong> / drag a file here.
        </div>
        <textarea id="code-editor" class="wrm-textarea" spellcheck="false" style="display:none;"></textarea>
        <div id="image-preview" class="wrm-preview-pane" style="display:none;"></div>
        <div id="diff-view" class="wrm-diff-pane" style="display:none;"></div>
      </div>
    </section>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Web Resource Manager</span>
    <div class="dv-spacer"></div>
    <span id="editor-stats" style="font-family:monospace;font-size:11px;color:var(--text-sec);">—</span>
  </footer>

  <!-- ══════════════ CREATE WEB RESOURCE MODAL ══════════════ -->
  <div class="dv-overlay" id="create-modal">
    <div class="dv-modal" style="width:540px;max-width:95vw;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>➕ Create New Web Resource</strong>
        <button class="dv-btn dv-btn-sm" id="cm-close">✕</button>
      </div>
      <div class="wrm-form-grid">
        <div class="wrm-field">
          <label>Schema Name (with prefix)</label>
          <input type="text" id="new-name" placeholder="new_/scripts/account.js">
        </div>
        <div class="wrm-field">
          <label>Display Name</label>
          <input type="text" id="new-displayname" placeholder="Account Form Script">
        </div>
        <div class="wrm-field">
          <label>Web Resource Type</label>
          <select id="new-type">
            <option value="3">Script (JS)</option>
            <option value="1">Webpage (HTML)</option>
            <option value="2">Style Sheet (CSS)</option>
            <option value="4">Data (XML)</option>
            <option value="11">Vector (SVG)</option>
            <option value="12">String (ResX)</option>
            <option value="5">Image (PNG)</option>
            <option value="6">Image (JPG)</option>
            <option value="7">Image (GIF)</option>
            <option value="10">Icon (ICO)</option>
          </select>
        </div>
        <div class="wrm-field">
          <label>Add to Unmanaged Solution (optional)</label>
          <select id="new-solution">
            <option value="">None (Default Solution only)</option>
          </select>
        </div>
      </div>
      <div class="wrm-field" style="margin-top:8px;">
        <label>Description</label>
        <input type="text" id="new-desc" placeholder="Optional description…">
      </div>
      <div class="wrm-field" style="margin-top:8px;">
        <label>Initial File (optional — otherwise starts with starter content)</label>
        <input type="file" id="new-file-input">
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
        <button class="dv-btn" id="cm-cancel">Cancel</button>
        <button class="dv-btn dv-btn-primary" id="cm-create">Create &amp; Publish</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ ADD TO SOLUTION MODAL ══════════════ -->
  <div class="dv-overlay" id="sol-modal">
    <div class="dv-modal" style="width:440px;max-width:95vw;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <strong>📦 Add Web Resource to Solution</strong>
        <button class="dv-btn dv-btn-sm" id="sm-close">✕</button>
      </div>
      <div class="wrm-field" style="margin-top:10px;">
        <label>Target Unmanaged Solution</label>
        <select id="sm-solution"></select>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;">
        <button class="dv-btn" id="sm-cancel">Cancel</button>
        <button class="dv-btn dv-btn-primary" id="sm-confirm">Add Component</button>
      </div>
    </div>
  </div>

  <!-- ══════════════ DELETE CONFIRM MODAL ══════════════ -->
  <div class="dv-overlay" id="del-modal">
    <div class="dv-modal" style="width:460px;max-width:95vw;">
      <strong>🗑️ Delete Web Resource</strong>
      <p id="del-msg" style="font-size:13px;color:var(--text-sec);margin:10px 0;"></p>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="dv-btn" id="dm-cancel">Cancel</button>
        <button class="dv-btn" id="dm-confirm" style="background:#d13438;color:#fff;border-color:#d13438;">Delete Permanently</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let context = null;
    let isSample = false;

    let solutions = [];
    let solutionComponentMap = new Map(); // solutionid -> Set(webresourceid)
    let webResources = [];                // [{ webresourceid, name, displayname, webresourcetype, ismanaged, iscustomizable, modifiedon, description }]
    let serverContentCache = new Map();   // webresourceid -> { base64, text }
    let drafts = new Map();               // webresourceid -> { base64, text, displayname, description }
    let expandedFolders = new Set();

    let selectedId = null;
    let activeTab = 'edit'; // 'edit' | 'preview' | 'diff'

    const TYPE_INFO = {
      1:  { label: 'HTML', mime: 'text/html', isText: true, isImage: false, icon: '🌐', ext: '.html' },
      2:  { label: 'CSS',  mime: 'text/css', isText: true, isImage: false, icon: '🎨', ext: '.css' },
      3:  { label: 'JS',   mime: 'application/javascript', isText: true, isImage: false, icon: '📜', ext: '.js' },
      4:  { label: 'XML',  mime: 'application/xml', isText: true, isImage: false, icon: '📄', ext: '.xml' },
      5:  { label: 'PNG',  mime: 'image/png', isText: false, isImage: true, icon: '🖼️', ext: '.png' },
      6:  { label: 'JPG',  mime: 'image/jpeg', isText: false, isImage: true, icon: '🖼️', ext: '.jpg' },
      7:  { label: 'GIF',  mime: 'image/gif', isText: false, isImage: true, icon: '🖼️', ext: '.gif' },
      8:  { label: 'XAP',  mime: 'application/x-silverlight-app', isText: false, isImage: false, icon: '⚙️', ext: '.xap' },
      9:  { label: 'XSL',  mime: 'application/xml', isText: true, isImage: false, icon: '📄', ext: '.xsl' },
      10: { label: 'ICO',  mime: 'image/x-icon', isText: false, isImage: true, icon: '🖼️', ext: '.ico' },
      11: { label: 'SVG',  mime: 'image/svg+xml', isText: true, isImage: true, icon: '✨', ext: '.svg' },
      12: { label: 'ResX', mime: 'application/xml', isText: true, isImage: false, icon: '🌍', ext: '.resx' }
    };

    function toHost(type, payload = {}) {
      window.parent?.postMessage({ source: 'dvopentools-tool', type, payload }, HOST_ORIGIN);
    }

    toHost('TOOL_READY');
    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      if (e.data.type === 'CONTEXT_INIT') {
        context = e.data.payload;
        enableControls();
        loadOrgWebResources();
      }
      if (e.data.type === 'TOOL_LAUNCH' && e.data.payload?.name) {
        document.getElementById('f-search').value = e.data.payload.name;
        renderTree();
      }
    });

    function enableControls() {
      ['btn-new', 'btn-refresh'].forEach(id => {
        document.getElementById(id).disabled = false;
      });
    }

    /* ─── UTF-8 Safe Base64 Codecs ───────────────────────────── */
    function decodeBase64ToBytes(b64) {
      if (!b64) return new Uint8Array(0);
      const bin = atob(String(b64).replace(/\s+/g, ''));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function decodeBase64Utf8(b64) {
      if (!b64) return '';
      try {
        return new TextDecoder('utf-8', { fatal: false }).decode(decodeBase64ToBytes(b64));
      } catch {
        return '';
      }
    }

    function encodeBytesToBase64(bytes) {
      if (!bytes || !bytes.length) return '';
      let bin = '';
      const CHUNK = 8192;
      for (let i = 0; i < bytes.length; i += CHUNK) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
      }
      return btoa(bin);
    }

    function encodeBase64Utf8(text) {
      const bytes = new TextEncoder().encode(String(text ?? ''));
      return encodeBytesToBase64(bytes);
    }

    function detectTypeFromFilename(filename) {
      const ext = (filename.split('.').pop() || '').toLowerCase();
      if (ext === 'js') return 3;
      if (ext === 'html' || ext === 'htm') return 1;
      if (ext === 'css') return 2;
      if (ext === 'xml') return 4;
      if (ext === 'png') return 5;
      if (ext === 'jpg' || ext === 'jpeg') return 6;
      if (ext === 'gif') return 7;
      if (ext === 'xsl' || ext === 'xslt') return 9;
      if (ext === 'ico') return 10;
      if (ext === 'svg') return 11;
      if (ext === 'resx') return 12;
      return 3;
    }

    /* ─── Dataverse Fetchers ────────────────────────────────── */
    async function fetchAllPages(path, maxRows = 3000) {
      const all = [];
      let next = path;
      while (next && all.length < maxRows) {
        const res = await DV.fetch(next);
        all.push(...(res.value || []));
        next = res['@odata.nextLink'] || '';
      }
      return all;
    }

    async function loadOrgWebResources() {
      isSample = false;
      document.getElementById('wr-tree').innerHTML = '<div class="dv-empty">Loading Web Resources & Solutions…</div>';
      try {
        const [solList, compList, wrList] = await Promise.all([
          fetchAllPages('/solutions?$filter=isvisible eq true&$select=solutionid,uniquename,friendlyname,ismanaged&$expand=publisherid($select=customizationprefix)&$orderby=friendlyname asc', 500),
          fetchAllPages('/solutioncomponents?$select=objectid,_solutionid_value&$filter=componenttype eq 61', 5000).catch(() => []),
          fetchAllPages('/webresourceset?$select=webresourceid,name,displayname,webresourcetype,ismanaged,iscustomizable,modifiedon,description&$orderby=name asc&$top=500', 3000)
        ]);

        solutions = solList.map(s => ({
          id: String(s.solutionid).toLowerCase(),
          uniqueName: s.uniquename,
          friendlyName: s.friendlyname || s.uniquename,
          isManaged: Boolean(s.ismanaged),
          prefix: s.publisherid?.customizationprefix || 'new'
        }));

        solutionComponentMap = new Map();
        for (const c of compList) {
          const sid = String(c._solutionid_value || '').toLowerCase();
          const oid = String(c.objectid || '').toLowerCase();
          if (!sid || !oid) continue;
          if (!solutionComponentMap.has(sid)) solutionComponentMap.set(sid, new Set());
          solutionComponentMap.get(sid).add(oid);
        }

        webResources = wrList.map(w => ({
          id: String(w.webresourceid).toLowerCase(),
          name: w.name || '',
          displayName: w.displayname || '',
          type: Number(w.webresourcetype) || 3,
          isManaged: Boolean(w.ismanaged),
          isCustomizable: w.iscustomizable ? Boolean(w.iscustomizable.Value) : !w.ismanaged,
          modifiedOn: w.modifiedon || '',
          description: w.description || ''
        }));

        serverContentCache.clear();
        drafts.clear();
        selectedId = null;
        populateSolutionSelectors();
        expandTopFolders(webResources);
        renderTree();
        clearEditorView();
        DV.notify(`Loaded ${webResources.length} Web Resources across ${solutions.length} solutions.`, 'success');
      } catch (err) {
        document.getElementById('wr-tree').innerHTML = DV.ui.error(err.message);
        DV.notify(err.message, 'error');
      }
    }

    function populateSolutionSelectors() {
      const fSol = document.getElementById('f-solution');
      const prev = fSol.value;
      fSol.innerHTML = '<option value="ALL">All Solutions</option>' +
        solutions.map(s => `<option value="${DV.esc(s.id)}">${s.isManaged ? '🔒 ' : '✏️ '}${DV.esc(s.friendlyName)} (${DV.esc(s.uniqueName)})</option>`).join('');
      if (prev && solutions.some(s => s.id === prev)) fSol.value = prev;

      const unmanaged = solutions.filter(s => !s.isManaged);
      const solOpts = unmanaged.map(s => `<option value="${DV.esc(s.uniqueName)}" data-prefix="${DV.esc(s.prefix)}">${DV.esc(s.friendlyName)} (${DV.esc(s.uniqueName)})</option>`).join('');
      document.getElementById('new-solution').innerHTML = '<option value="">None (Default Solution only)</option>' + solOpts;
      document.getElementById('sm-solution').innerHTML = solOpts || '<option value="">No unmanaged solutions found</option>';
    }

    /* ─── Virtual Folder Tree Builder & Renderer ─────────────── */
    function getFilteredWebResources() {
      const solId = document.getElementById('f-solution').value;
      const typeF = document.getElementById('f-type').value;
      const scopeF = document.getElementById('f-scope').value;
      const q = document.getElementById('f-search').value.trim().toLowerCase();
      const allowedSet = (solId !== 'ALL' && solutionComponentMap.has(solId)) ? solutionComponentMap.get(solId) : null;

      return webResources.filter(w => {
        if (solId !== 'ALL') {
          if (!allowedSet || !allowedSet.has(w.id)) return false;
        }
        if (typeF === 'IMAGES') {
          if (![5, 6, 7, 10].includes(w.type)) return false;
        } else if (typeF !== 'ALL' && w.type !== Number(typeF)) {
          return false;
        }
        if (scopeF === '0' && w.isManaged) return false;
        if (scopeF === '1' && !w.isManaged) return false;
        if (q && !`${w.name} ${w.displayName}`.toLowerCase().includes(q)) return false;
        return true;
      });
    }

    function buildFolderTree(items) {
      const root = { path: '', name: '', folders: new Map(), files: [] };
      for (const wr of items) {
        const parts = String(wr.name || '').split('/').filter(Boolean);
        if (parts.length <= 1) {
          root.files.push({ label: wr.name, wr });
          continue;
        }
        let curr = root;
        let accum = '';
        for (let i = 0; i < parts.length - 1; i++) {
          const seg = parts[i];
          accum = accum ? `${accum}/${seg}` : seg;
          if (!curr.folders.has(seg)) {
            curr.folders.set(seg, { path: accum, name: seg, folders: new Map(), files: [] });
          }
          curr = curr.folders.get(seg);
        }
        curr.files.push({ label: parts[parts.length - 1], wr });
      }
      return root;
    }

    function expandTopFolders(items) {
      const tree = buildFolderTree(items);
      for (const f of tree.folders.values()) expandedFolders.add(f.path);
    }

    function collectAllFolderPaths(node, out = []) {
      for (const child of node.folders.values()) {
        out.push(child.path);
        collectAllFolderPaths(child, out);
      }
      return out;
    }

    function renderTreeNode(node, forceExpand) {
      let html = '';
      const sortedFolders = [...node.folders.values()].sort((a, b) => a.name.localeCompare(b.name));
      for (const folder of sortedFolders) {
        const isOpen = forceExpand || expandedFolders.has(folder.path);
        html += `
          <div class="wrm-folder">
            <div class="wrm-folder-hdr" data-folder="${DV.esc(folder.path)}">
              <span class="wrm-caret">${isOpen ? '▾' : '▸'}</span>
              <span>📁</span>
              <span>${DV.esc(folder.name)}</span>
            </div>
            ${isOpen ? `<div class="wrm-folder-children">${renderTreeNode(folder, forceExpand)}</div>` : ''}
          </div>`;
      }

      const sortedFiles = [...node.files].sort((a, b) => a.label.localeCompare(b.label));
      for (const f of sortedFiles) {
        const wr = f.wr;
        const ti = TYPE_INFO[wr.type] || { icon: '📄', label: '?' };
        const isDirty = drafts.has(wr.id);
        const isActive = wr.id === selectedId;
        html += `
          <div class="wrm-file${isActive ? ' active' : ''}" data-wr-id="${DV.esc(wr.id)}" title="${DV.esc(wr.name)}${wr.displayName ? ' — ' + DV.esc(wr.displayName) : ''}">
            <span>${ti.icon}</span>
            <span class="wrm-file-name">${DV.esc(f.label)}</span>
            ${isDirty ? '<span class="wrm-dirty-dot" title="Unsaved changes">●</span>' : ''}
            ${wr.isManaged ? `<span class="wrm-lock" title="${wr.isCustomizable ? 'Managed (Customizable)' : 'Managed (Read-only)'}">${wr.isCustomizable ? '🛡️' : '🔒'}</span>` : ''}
          </div>`;
      }
      return html;
    }

    function renderTree() {
      const filtered = getFilteredWebResources();
      document.getElementById('st-count').textContent = String(filtered.length);
      document.getElementById('st-dirty').textContent = drafts.size ? `${drafts.size} unsaved` : '';
      const container = document.getElementById('wr-tree');
      if (!filtered.length) {
        container.innerHTML = DV.ui.empty('No Web Resources match your filters.');
        return;
      }
      const forceExpand = document.getElementById('f-search').value.trim().length > 0;
      const tree = buildFolderTree(filtered);
      container.innerHTML = renderTreeNode(tree, forceExpand);

      container.querySelectorAll('.wrm-folder-hdr').forEach(el => {
        el.addEventListener('click', () => {
          const fp = el.dataset.folder;
          if (expandedFolders.has(fp)) expandedFolders.delete(fp);
          else expandedFolders.add(fp);
          renderTree();
        });
      });

      container.querySelectorAll('.wrm-file').forEach(el => {
        el.addEventListener('click', () => selectWebResource(el.dataset.wrId));
      });
    }

    /* ─── Selection, Lazy Content Load & Dirty Drafts ─────────── */
    function getWorkingRecord(wr) {
      const srv = serverContentCache.get(wr.id) || { base64: '', text: '' };
      const draft = drafts.get(wr.id);
      return {
        base64: draft ? draft.base64 : srv.base64,
        text: draft ? draft.text : srv.text,
        displayName: draft ? draft.displayName : wr.displayName,
        description: draft ? draft.description : wr.description
      };
    }

    async function selectWebResource(id) {
      const wr = webResources.find(w => w.id === id);
      if (!wr) return;
      selectedId = id;
      renderTree();

      if (!serverContentCache.has(id) && !isSample) {
        document.getElementById('tel-msg').textContent = `Fetching ${wr.name}…`;
        try {
          const full = await DV.fetch(`/webresourceset(${id})?$select=content,displayname,description`);
          const b64 = full.content || '';
          const ti = TYPE_INFO[wr.type] || { isText: true };
          serverContentCache.set(id, {
            base64: b64,
            text: ti.isText ? decodeBase64Utf8(b64) : ''
          });
          if (full.displayname !== undefined) wr.displayName = full.displayname || '';
          if (full.description !== undefined) wr.description = full.description || '';
        } catch (err) {
          DV.notify(`Failed to load ${wr.name}: ${err.message}`, 'error');
          return;
        }
      }

      const ti = TYPE_INFO[wr.type] || { label: 'File', isText: false, isImage: false };
      if (!ti.isText && ti.isImage && activeTab === 'edit') activeTab = 'preview';
      if (ti.isText && !ti.isImage && activeTab === 'preview') activeTab = 'edit';

      renderSelectedEditor();
    }

    function clearEditorView() {
      document.getElementById('meta-bar').style.display = 'none';
      document.getElementById('empty-editor').style.display = 'flex';
      document.getElementById('code-editor').style.display = 'none';
      document.getElementById('image-preview').style.display = 'none';
      document.getElementById('diff-view').style.display = 'none';
      ['btn-upload-file', 'btn-save', 'btn-save-publish', 'btn-add-sol', 'btn-download', 'btn-delete'].forEach(id => {
        document.getElementById(id).disabled = true;
      });
    }

    function renderSelectedEditor() {
      const wr = webResources.find(w => w.id === selectedId);
      if (!wr) { clearEditorView(); return; }

      const ti = TYPE_INFO[wr.type] || { label: 'File', mime: 'application/octet-stream', isText: false, isImage: false };
      const working = getWorkingRecord(wr);
      const readOnly = wr.isManaged && !wr.isCustomizable;

      document.getElementById('meta-bar').style.display = 'flex';
      document.getElementById('empty-editor').style.display = 'none';
      document.getElementById('m-type').textContent = ti.label;
      document.getElementById('m-name').textContent = wr.name;
      const scopeEl = document.getElementById('m-scope');
      scopeEl.textContent = wr.isManaged ? (wr.isCustomizable ? 'Managed (Editable)' : 'Managed (Read-Only)') : 'Unmanaged';
      document.getElementById('m-displayname').value = working.displayName;
      document.getElementById('m-desc').value = working.description;
      document.getElementById('m-displayname').disabled = readOnly;
      document.getElementById('m-desc').disabled = readOnly;

      document.getElementById('btn-upload-file').disabled = readOnly;
      document.getElementById('btn-save').disabled = readOnly || !drafts.has(wr.id);
      document.getElementById('btn-save-publish').disabled = readOnly;
      document.getElementById('btn-add-sol').disabled = isSample;
      document.getElementById('btn-download').disabled = false;
      document.getElementById('btn-delete').disabled = wr.isManaged || isSample;

      document.querySelectorAll('#view-tabs [data-tab]').forEach(b => {
        b.classList.toggle('active', b.dataset.tab === activeTab);
        if (b.dataset.tab === 'edit') b.disabled = !ti.isText;
        if (b.dataset.tab === 'preview') b.disabled = !ti.isImage && wr.type !== 1;
        if (b.dataset.tab === 'diff') b.disabled = !ti.isText;
      });

      const editorEl = document.getElementById('code-editor');
      const prevEl = document.getElementById('image-preview');
      const diffEl = document.getElementById('diff-view');
      editorEl.style.display = 'none';
      prevEl.style.display = 'none';
      diffEl.style.display = 'none';

      if (activeTab === 'edit' && ti.isText) {
        editorEl.style.display = 'block';
        editorEl.readOnly = readOnly;
        editorEl.value = working.text;
        updateEditorStats(working.text, working.base64);
      } else if (activeTab === 'preview') {
        prevEl.style.display = 'flex';
        if (ti.isImage) {
          const b64 = working.base64 || (ti.isText ? encodeBase64Utf8(working.text) : '');
          const dataUrl = `data:${ti.mime};base64,${b64}`;
          prevEl.innerHTML = `<img class="wrm-preview-img" src="${dataUrl}" alt="${DV.esc(wr.name)}"><div style="font-size:12px;color:var(--text-sec);" id="img-dims">${DV.esc(ti.label)} Preview · ${Math.round(b64.length * 0.75)} bytes</div>`;
          const img = prevEl.querySelector('img');
          if (img) img.onload = () => {
            const d = document.getElementById('img-dims');
            if (d && img.naturalWidth) d.textContent = `${ti.label} · ${img.naturalWidth} × ${img.naturalHeight} px · ~${Math.round(b64.length * 0.75)} bytes`;
          };
        } else if (wr.type === 1) {
          prevEl.innerHTML = `<iframe sandbox="" style="width:100%;height:100%;border:1px solid var(--border);background:#fff;" srcdoc="${DV.esc(working.text)}"></iframe>`;
        } else {
          prevEl.innerHTML = DV.ui.empty('Visual preview unavailable for this file type.');
        }
      } else if (activeTab === 'diff' && ti.isText) {
        diffEl.style.display = 'block';
        const srvText = serverContentCache.get(wr.id)?.text || '';
        diffEl.innerHTML = renderSimpleLineDiff(srvText, working.text);
      }

      document.getElementById('tel-msg').textContent = `${wr.name} (${wr.id})`;
    }

    function updateEditorStats(text, b64) {
      const lines = text ? text.split('\n').length : 0;
      const bytes = b64 ? Math.round(b64.length * 0.75) : new TextEncoder().encode(text || '').length;
      document.getElementById('editor-stats').textContent = `${lines} lines · ${bytes} bytes`;
    }

    function markDraftChanged() {
      const wr = webResources.find(w => w.id === selectedId);
      if (!wr) return;
      const ti = TYPE_INFO[wr.type] || { isText: true };
      const srv = serverContentCache.get(wr.id) || { base64: '', text: '' };
      const currText = ti.isText ? document.getElementById('code-editor').value : (drafts.get(wr.id)?.text ?? srv.text);
      const currB64 = ti.isText ? encodeBase64Utf8(currText) : (drafts.get(wr.id)?.base64 ?? srv.base64);
      const currDisp = document.getElementById('m-displayname').value;
      const currDesc = document.getElementById('m-desc').value;

      const changed = currB64 !== srv.base64 || currDisp !== wr.displayName || currDesc !== wr.description;
      if (changed) {
        drafts.set(wr.id, { base64: currB64, text: currText, displayname: currDisp, description: currDesc });
      } else {
        drafts.delete(wr.id);
      }
      document.getElementById('btn-save').disabled = !drafts.has(wr.id);
      document.getElementById('st-dirty').textContent = drafts.size ? `${drafts.size} unsaved` : '';
      updateEditorStats(currText, currB64);
      renderTree();
    }

    function renderSimpleLineDiff(oldStr, newStr) {
      if (oldStr === newStr) return '<div class="dv-empty">No unsaved content changes vs server copy.</div>';
      const oldLines = oldStr.split('\n');
      const newLines = newStr.split('\n');
      const max = Math.max(oldLines.length, newLines.length);
      const out = [];
      for (let i = 0; i < max; i++) {
        const o = oldLines[i];
        const n = newLines[i];
        if (o === n) {
          if (i < 3 || (oldLines[i + 1] !== newLines[i + 1]) || (oldLines[i - 1] !== newLines[i - 1])) {
            out.push(`<span class="diff-ctx">  ${String(i + 1).padStart(4)} | ${DV.esc(o ?? '')}</span>`);
          }
        } else {
          if (o !== undefined) out.push(`<span class="diff-del">- ${String(i + 1).padStart(4)} | ${DV.esc(o)}</span>`);
          if (n !== undefined) out.push(`<span class="diff-add">+ ${String(i + 1).padStart(4)} | ${DV.esc(n)}</span>`);
        }
      }
      return out.join('') || '<div class="dv-empty">Metadata changes only (Display Name / Description).</div>';
    }

    /* ─── Save, PublishXml, Create, AddSolution, Delete ──────── */
    async function saveCurrent(alsoPublish = false) {
      const wr = webResources.find(w => w.id === selectedId);
      if (!wr) return;
      if (isSample) {
        DV.notify('Sample mode: changes kept in memory only.', 'info');
        return;
      }

      const working = getWorkingRecord(wr);
      const payload = {
        content: working.base64,
        displayname: working.displayName,
        description: working.description
      };

      try {
        if (drafts.has(wr.id)) {
          await DV.fetch(`/webresourceset(${wr.id})`, {
            method: 'PATCH',
            body: JSON.stringify(payload)
          });
          serverContentCache.set(wr.id, { base64: working.base64, text: working.text });
          wr.displayName = working.displayName;
          wr.description = working.description;
          drafts.delete(wr.id);
        }

        if (alsoPublish) {
          await publishWebResources([wr.id]);
          DV.notify(`Saved & published ${wr.name}`, 'success');
        } else {
          DV.notify(`Saved ${wr.name} (remember to Publish!)`, 'success');
        }
        renderSelectedEditor();
        renderTree();
      } catch (err) {
        DV.notify(err.message, 'error');
      }
    }

    async function publishWebResources(ids) {
      if (!ids.length) return;
      const nodes = ids.map(id => `<webresource>{${id.replace(/[{}]/g, '')}}</webresource>`).join('');
      const parameterXml = `<importexportxml><webresources>${nodes}</webresources></importexportxml>`;
      await DV.fetch('/PublishXml', {
        method: 'POST',
        body: JSON.stringify({ ParameterXml: parameterXml })
      });
    }

    async function applyLocalFileReplacement(file) {
      const wr = webResources.find(w => w.id === selectedId);
      if (!wr) return;
      if (wr.isManaged && !wr.isCustomizable) {
        DV.notify('Cannot modify a non-customizable managed Web Resource.', 'warning');
        return;
      }
      const buf = new Uint8Array(await file.arrayBuffer());
      const b64 = encodeBytesToBase64(buf);
      const ti = TYPE_INFO[wr.type] || { isText: false };
      const text = ti.isText ? new TextDecoder('utf-8', { fatal: false }).decode(buf) : '';
      const currDisp = document.getElementById('m-displayname').value;
      const currDesc = document.getElementById('m-desc').value;

      drafts.set(wr.id, { base64: b64, text, displayname: currDisp, description: currDesc });
      renderSelectedEditor();
      renderTree();
      DV.notify(`Loaded ${file.name} (${buf.length} bytes) into draft. Click Save & Publish to upload.`, 'info');
    }

    async function createWebResource() {
      const name = document.getElementById('new-name').value.trim();
      const displayname = document.getElementById('new-displayname').value.trim() || name;
      const type = Number(document.getElementById('new-type').value);
      const solUnique = document.getElementById('new-solution').value;
      const description = document.getElementById('new-desc').value.trim();
      const fileInput = document.getElementById('new-file-input');

      if (!name) { DV.notify('Web Resource name is required.', 'warning'); return; }
      if (isSample) { DV.notify('Sample mode: cannot create in Dataverse.', 'info'); return; }

      let b64 = '';
      let rawText = '';
      if (fileInput.files && fileInput.files[0]) {
        const buf = new Uint8Array(await fileInput.files[0].arrayBuffer());
        b64 = encodeBytesToBase64(buf);
        if (TYPE_INFO[type]?.isText) rawText = new TextDecoder('utf-8', { fatal: false }).decode(buf);
      } else {
        rawText = type === 3 ? '// Dataverse Script\n' : type === 1 ? '<!DOCTYPE html>\n<html>\n<body></body>\n</html>\n' : type === 2 ? '/* Stylesheet */\n' : '<root></root>\n';
        b64 = encodeBase64Utf8(rawText);
      }

      try {
        const created = await DV.fetch('/webresourceset?$select=webresourceid', {
          method: 'POST',
          headers: { Prefer: 'return=representation' },
          body: JSON.stringify({ name, displayname, webresourcetype: type, content: b64, description })
        });
        const newId = String(created?.webresourceid || '').toLowerCase();
        if (solUnique && newId) {
          await DV.fetch('/AddSolutionComponent', {
            method: 'POST',
            body: JSON.stringify({
              ComponentId: newId,
              ComponentType: 61,
              SolutionUniqueName: solUnique,
              AddRequiredComponents: false
            })
          });
        }
        if (newId) await publishWebResources([newId]);

        document.getElementById('create-modal').classList.remove('open');
        DV.notify(`Created & published ${name}`, 'success');
        await loadOrgWebResources();
        if (newId) selectWebResource(newId);
      } catch (err) {
        DV.notify(err.message, 'error');
      }
    }

    /* ─── Event Bindings ────────────────────────────────────── */
    ['f-solution', 'f-type', 'f-scope', 'f-search'].forEach(id => {
      document.getElementById(id).addEventListener(id === 'f-search' ? 'input' : 'change', renderTree);
    });
    document.getElementById('btn-expand-all').addEventListener('click', () => {
      collectAllFolderPaths(buildFolderTree(getFilteredWebResources())).forEach(p => expandedFolders.add(p));
      renderTree();
    });
    document.getElementById('btn-collapse-all').addEventListener('click', () => {
      expandedFolders.clear();
      renderTree();
    });

    document.querySelectorAll('#view-tabs [data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeTab = btn.dataset.tab;
        renderSelectedEditor();
      });
    });

    const editorEl = document.getElementById('code-editor');
    editorEl.addEventListener('input', markDraftChanged);
    editorEl.addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const s = editorEl.selectionStart, end = editorEl.selectionEnd;
        editorEl.value = editorEl.value.slice(0, s) + '  ' + editorEl.value.slice(end);
        editorEl.selectionStart = editorEl.selectionEnd = s + 2;
        markDraftChanged();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
        e.preventDefault();
        saveCurrent(e.shiftKey);
      }
    });
    document.getElementById('m-displayname').addEventListener('input', markDraftChanged);
    document.getElementById('m-desc').addEventListener('input', markDraftChanged);

    document.getElementById('btn-save').addEventListener('click', () => saveCurrent(false));
    document.getElementById('btn-save-publish').addEventListener('click', () => saveCurrent(true));
    document.getElementById('btn-refresh').addEventListener('click', loadOrgWebResources);

    document.getElementById('btn-upload-file').addEventListener('click', () => document.getElementById('file-replace-input').click());
    document.getElementById('file-replace-input').addEventListener('change', e => {
      if (e.target.files && e.target.files[0]) applyLocalFileReplacement(e.target.files[0]);
      e.target.value = '';
    });

    const dz = document.getElementById('editor-dropzone');
    dz.addEventListener('dragover', e => { e.preventDefault(); if (selectedId) dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      const file = e.dataTransfer?.files?.[0];
      if (file && selectedId) applyLocalFileReplacement(file);
    });

    document.getElementById('btn-download').addEventListener('click', () => {
      const wr = webResources.find(w => w.id === selectedId);
      if (!wr) return;
      const working = getWorkingRecord(wr);
      const ti = TYPE_INFO[wr.type] || { mime: 'application/octet-stream', ext: '' };
      const bytes = working.base64 ? decodeBase64ToBytes(working.base64) : new TextEncoder().encode(working.text || '');
      const blob = new Blob([bytes], { type: ti.mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const base = wr.name.split('/').pop() || wr.name;
      a.download = base.includes('.') ? base : base + ti.ext;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    });

    // Create modal bindings
    document.getElementById('btn-new').addEventListener('click', () => {
      const fSol = document.getElementById('f-solution').value;

    ['cm-close', 'cm-cancel'].forEach(id => document.getElementById(id).addEventListener('click', () => document.getElementById('create-modal').classList.remove('open')));
    document.getElementById('cm-create').addEventListener('click', createWebResource);

    // Add to Solution modal bindings

    ['sm-close', 'sm-cancel'].forEach(id => document.getElementById(id).addEventListener('click', () => document.getElementById('sol-modal').classList.remove('open')));
    document.getElementById('sm-confirm').addEventListener('click', async () => {

        DV.notify(err.message, 'error');

    document.getElementById('btn-delete').addEventListener('click', () => {
      const wr = webResources.find(w => w.id === selectedId);

      document.getElementById('del-msg').textContent = `Permanently delete "${wr.name}" (${wr.id}) from Dataverse?`;

    document.getElementById('dm-cancel').addEventListener('click', () => document.getElementById('del-modal').classList.remove('open'));
    document.getElementById('dm-confirm').addEventListener('click', async () => {
