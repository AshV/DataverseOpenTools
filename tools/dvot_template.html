<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tool</title>

  <!--
    ╔══════════════════════════════════════════════════════╗
    ║   DV Open Tools — Lightweight Tool Template          ║
    ║   Consumes shared CSS (.dv-*) & window.DV from Host  ║
    ╚══════════════════════════════════════════════════════╝
  -->
  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "my-tool",
    "name":           "My Tool",
    "version":        "1.0.0",
    "description":    "One or two sentences describing what this tool does.",
    "icon":           "🛠️",
    "category":       "General",
    "author":         "Your Name",
    "minHostVersion": "2025.11.1"
  }
  </script>
</head>
<body class="dv-app">

  <div class="dv-toolbar">
    <strong>🛠️ My Tool</strong>
    <div class="dv-spacer"></div>
    <button class="dv-btn dv-btn-primary" id="run-btn" disabled>Waiting for host…</button>
  </div>

  <div class="dv-scroll dv-pad">
    <pre class="dv-code" id="output">Output will appear here.</pre>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Click status pill after query to inspect HTTP headers</span>
  </footer>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let context = null;
    let store = null;

    function toHost(type, payload = {}) {
      window.parent?.postMessage({ source: 'dvopentools-tool', type, payload }, HOST_ORIGIN);
    }

    toHost('TOOL_READY');

    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN || e.data?.source !== 'dvopentools-host') return;
      const { type, payload } = e.data;
      if (type === 'CONTEXT_INIT') {
        context = payload;
        store = window.DV?.store('my-tool');
        document.getElementById('run-btn').textContent = 'Run Query';
        document.getElementById('run-btn').disabled = false;
      }
      if (type === 'TOOL_LAUNCH' && payload) {
        // Handle deep-link launch payload when opened via DV.openTool('my-tool', payload)
      }
    });

    document.getElementById('run-btn').addEventListener('click', async () => {
      if (!context || !window.DV) return;
      const btn = document.getElementById('run-btn');
      const out = document.getElementById('output');
      btn.disabled = true; btn.textContent = 'Loading…';

      try {
        // Host Security Gateway intercepts all fetch() calls transparently under Safe Mode / Zero Trust
        const data = await DV.fetch('/accounts?$select=name,createdon&$top=10');
        out.textContent = JSON.stringify(data.value, null, 2);
        DV.notify(`Loaded ${data.value?.length ?? 0} records`, 'success');
        DV.setTitle(`My Tool (${data.value?.length ?? 0})`);
        store?.set('lastRun', new Date().toISOString());
      } catch (err) {
        out.textContent = `Error: ${err.message}`;
        DV.notify(err.message, 'error');
      } finally {
        btn.disabled = false; btn.textContent = 'Run Query';
      }
    });
  </script>
</body>
</html>
