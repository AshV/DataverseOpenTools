<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model-Driven App &amp; Sitemap Auditor</title>
  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "app-sitemap",
    "name":           "App & Sitemap Auditor",
    "version":        "1.0.0",
    "description":    "Inspect Model-Driven Apps (appmodules), assigned Security Roles, app components, and parsed SiteMap XML navigation trees (Area → Group → SubArea & privileges).",
    "icon":           "🗺️",
    "category":       "Configuration",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.1"
  }
  </script>
  <style>
    .as-split { flex: 1; display: grid; grid-template-columns: minmax(310px, 36%) minmax(0, 1fr); min-height: 0; }
    @media (max-width: 980px) { .as-split { grid-template-columns: 1fr; } }
    .as-left { overflow: auto; border-right: 2px solid var(--border); }
    .as-right { overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .as-area { border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; background: var(--surface); }
    .as-group { margin: 8px 0 0 14px; border-left: 2px solid var(--border); padding-left: 10px; }
    .as-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 4px; font-size: 12px; margin-top: 3px; background: var(--surface-2); flex-wrap: wrap; }
  </style>
</head>
<body class="dv-app">

  <div class="dv-toolbar">
    <input type="text" id="inp-search" placeholder="Search Model-Driven Apps or Sitemaps…" style="flex:1;min-width:200px;">
    <button class="dv-btn dv-btn-primary" id="btn-load">↻ Reload</button>
  </div>

  <div class="as-split">
    <div class="as-left" id="app-list">
      <div class="dv-empty">Loading Model-Driven Apps &amp; Sitemaps…</div>
    </div>
    <div class="as-right" id="app-detail">
      <div class="dv-empty">Select a Model-Driven App on the left to inspect its parsed SiteMap navigation hierarchy, assigned Security Roles, and app components.</div>
    </div>
  </div>

  <footer class="dv-footer">
    <span class="dv-pill" id="tel-pill">Ready</span>
    <span id="tel-msg" style="font-size:11px;font-family:monospace;">—</span>
    <div class="dv-spacer"></div>
    <span id="tel-count">0 apps</span>
  </footer>

  <script>
    'use strict';

    const S = { apps: [], sitemaps: [], components: [] };
    const $ = id => document.getElementById(id);
    const norm = id => String(id || '').replace(/[{}]/g, '').toLowerCase();

    async function loadAll() {
      $('btn-load').disabled = true;
      try {
        const [aRes, smRes, compRes] = await Promise.all([
          DV.fetch('/appmodules?$select=appmoduleid,name,uniquename,description,url,clienttype,publishedon,statecode&$orderby=name asc'),
          DV.fetch('/sitemaps?$select=sitemapid,sitemapname,sitemapnameunique,sitemapxml'),
          DV.fetch('/appmodulecomponents?$select=_appmoduleidunique_value,componenttype,objectid').catch(() => ({ value: [] }))
        ]);
        S.apps = aRes.value || [];
        S.sitemaps = smRes.value || [];
        S.components = compRes.value || [];
        $('tel-count').textContent = `${S.apps.length} apps • ${S.sitemaps.length} sitemaps`;
        renderList();
      } catch (err) {
        $('app-list').innerHTML = DV.ui.error(err.message);
      } finally {
        $('btn-load').disabled = false;
      }
    }

    function renderList() {
      const q = $('inp-search').value.trim().toLowerCase();
      const rows = S.apps.filter(a => !q || `${a.name} ${a.uniquename} ${a.url}`.toLowerCase().includes(q));
      if (!rows.length) { $('app-list').innerHTML = DV.ui.empty('No Model-Driven Apps match.'); return; }

      $('app-list').innerHTML = `<table class="dv-table"><thead><tr><th>App Name</th><th>Unique Name</th><th>State</th></tr></thead><tbody>` +
        rows.map((a, i) => `
          <tr class="as-row" data-idx="${i}" style="cursor:pointer;">
            <td><strong>${DV.esc(a.name)}</strong><div style="font-size:11px;color:var(--text-muted);">${DV.esc(a.url || '')}</div></td>
            <td><code>${DV.esc(a.uniquename)}</code></td>
            <td><span class="dv-badge ${Number(a.statecode) === 0 ? 'dv-b-ok' : ''}">${Number(a.statecode) === 0 ? 'Active' : 'Inactive'}</span></td>
          </tr>`).join('') + '</tbody></table>';

      $('app-list').querySelectorAll('.as-row').forEach(tr => {
        tr.addEventListener('click', () => inspectApp(rows[Number(tr.dataset.idx)]));
      });
    }

    function parseSitemapXml(xml) {
      if (!xml) return '<div class="dv-empty">No sitemap XML linked.</div>';
      const doc = new DOMParser().parseFromString(xml, 'text/xml');
      if (doc.querySelector('parsererror')) return DV.ui.error('Invalid SiteMap XML');
      const areas = Array.from(doc.querySelectorAll('SiteMap > Area'));
      if (!areas.length) return '<div class="dv-empty">No Areas in SiteMap XML.</div>';

      return areas.map(area => {
        const aTitle = area.querySelector(':scope > Titles > Title')?.getAttribute('Title') || area.getAttribute('Title') || area.getAttribute('Id');
        const groups = Array.from(area.querySelectorAll(':scope > Group')).map(grp => {
          const gTitle = grp.querySelector(':scope > Titles > Title')?.getAttribute('Title') || grp.getAttribute('Title') || grp.getAttribute('Id');
          const subs = Array.from(grp.querySelectorAll(':scope > SubArea')).map(sub => {
            const sTitle = sub.querySelector(':scope > Titles > Title')?.getAttribute('Title') || sub.getAttribute('Title') || sub.getAttribute('Id');
            const target = sub.getAttribute('Entity')
              ? `Table: ${sub.getAttribute('Entity')}`
              : sub.getAttribute('Url')
                ? `URL: ${sub.getAttribute('Url')}`
                : sub.getAttribute('Page')
                  ? `Page: ${sub.getAttribute('Page')}`
                  : (sub.getAttribute('ResourceId') || 'Custom');
            const privs = Array.from(sub.querySelectorAll(':scope > Privilege')).map(p => `${p.getAttribute('Entity')}:${p.getAttribute('Privilege')}`).join(', ');
            return `<div class="as-sub">
              <span><strong>${DV.esc(sTitle)}</strong> <span style="color:var(--text-muted);font-family:monospace;">(${DV.esc(sub.getAttribute('Id'))})</span></span>
              <span><code>${DV.esc(target)}</code>${privs ? ` <span class="dv-badge">${DV.esc(privs)}</span>` : ''}</span>
            </div>`;
          }).join('');
          return `<div class="as-group"><strong>📂 ${DV.esc(gTitle)}</strong>${subs}</div>`;
        }).join('');
        return `<div class="as-area"><strong>🗂️ Area: ${DV.esc(aTitle)}</strong> <span style="font-size:11px;color:var(--text-muted);">(${DV.esc(area.getAttribute('Id'))})</span>${groups}</div>`;
      }).join('');
    }

    async function inspectApp(app) {
      $('app-detail').innerHTML = `<div class="dv-empty">Inspecting ${DV.esc(app.name)}…</div>`;
      try {
        const rolesRes = await DV.fetch(`/appmodules(${app.appmoduleid})/appmoduleroles_association?$select=roleid,name`).catch(() => ({ value: [] }));
        const roles = rolesRes.value || [];

        // Find matching sitemap either by appmodulecomponents (type 62) or name match fallback
        const smCompIds = new Set(S.components.filter(c => Number(c.componenttype) === 62 && c.objectid).map(c => norm(c.objectid)));
        const matchingSitemap =
          S.sitemaps.find(s => norm(s.sitemapnameunique) === norm(app.uniquename)) ||
          S.sitemaps.find(s => norm(s.sitemapname) === norm(app.name)) ||
          S.sitemaps.find(s => smCompIds.has(norm(s.sitemapid)));

        const sitemapPickerHtml = S.sitemaps.map((sm, idx) =>
          `<option value="${idx}" ${matchingSitemap?.sitemapid === sm.sitemapid ? 'selected' : ''}>${DV.esc(sm.sitemapname || sm.sitemapnameunique || sm.sitemapid)}</option>`
        ).join('');

        $('app-detail').innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
            <div>
              <strong style="font-size:15px;">${DV.esc(app.name)}</strong>
              <span style="font-size:12px;color:var(--text-muted);"> • <code>${DV.esc(app.uniquename)}</code></span>
            </div>
            <label style="font-size:12px;">SiteMap: <select id="sel-sitemap">${sitemapPickerHtml}</select></label>
          </div>
          <div>
            <strong>Assigned Security Roles (${roles.length})</strong>
            <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px;">
              ${roles.length ? roles.map(r => `<span class="dv-badge dv-b-info">🛡️ ${DV.esc(r.name)}</span>`).join('') : '<span style="color:var(--text-muted);font-size:12px;">No specific roles returned (check Environment Maker / System Admin access).</span>'}
            </div>
          </div>
          <div><strong>Navigation Tree (SiteMap)</strong></div>
          <div id="sitemap-tree" style="display:flex;flex-direction:column;gap:8px;">${parseSitemapXml(matchingSitemap?.sitemapxml || S.sitemaps[0]?.sitemapxml)}</div>
        `;

        $('sel-sitemap')?.addEventListener('change', e => {
          const sm = S.sitemaps[Number(e.target.value)];
          $('sitemap-tree').innerHTML = parseSitemapXml(sm?.sitemapxml);
        });
      } catch (err) {
        $('app-detail').innerHTML = DV.ui.error(err.message);
      }
    }

    DV.onReady(async () => {
      $('btn-load').addEventListener('click', loadAll);
      $('inp-search').addEventListener('input', renderList);
      await loadAll();
    });
  </script>
</body>
</html>
