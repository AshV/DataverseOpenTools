<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access &amp; Privilege Diagnostics</title>

  <script type="application/json" id="dvopentools-manifest">
  {
    "id":             "access-checker",
    "name":           "Access Diagnostics",
    "version":        "1.0.0",
    "description":    "Diagnose effective record permissions via RetrievePrincipalAccess and inspect Security Roles, Team memberships, and record ownership.",
    "icon":           "🛡️",
    "category":       "Security",
    "author":         "Ashish Vishwakarma",
    "minHostVersion": "2025.11.0"
  }
  </script>

  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f8f9fa;
      --bg-card: #ffffff;
      --border: #e1dfdd;
      --border-subtle: #edebe9;
      --text: #201f1e;
      --text-sec: #605e5c;
      --text-muted: #8a8886;
      --primary: #0078d4;
      --primary-hover: #106ebe;
      --primary-subtle: #eff6fc;
      --ok-bg: #dff6dd;
      --ok-color: #107c10;
      --no-bg: #fde7e9;
      --no-color: #d13438;
    }
    body.dark {
      --bg: #1e1e1e;
      --bg-alt: #252526;
      --bg-card: #2d2d2d;
      --border: #3e3e42;
      --border-subtle: #333337;
      --text: #d4d4d4;
      --text-sec: #a6a6a6;
      --text-muted: #767676;
      --primary: #2886de;
      --primary-hover: #4797e2;
      --primary-subtle: #19324d;
      --ok-bg: #1c361e;
      --ok-color: #57b35e;
      --no-bg: #431c20;
      --no-color: #f1707b;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 13px; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
    }

    .setup-bar {
      padding: 12px 16px; background: var(--bg-alt); border-bottom: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 12px; align-items: end; flex-shrink: 0;
    }
    .field label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sec); margin-bottom: 4px; text-transform: uppercase; }
    select, input[type="text"] {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text); font-size: 12px; font-family: inherit;
    }
    .btn {
      padding: 6px 14px; border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 12px; font-family: inherit;
    }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .body-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card {
      border: 1px solid var(--border); border-radius: 6px; background: var(--bg-card); overflow: hidden;
    }
    .card-hdr {
      padding: 9px 14px; background: var(--bg-alt); border-bottom: 1px solid var(--border);
      font-weight: 700; display: flex; justify-content: space-between; align-items: center;
    }
    .card-body { padding: 14px; }

    .rights-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px;
    }
    .right-tile {
      padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; font-weight: 600;
    }
    .right-tile.granted { background: var(--ok-bg); color: var(--ok-color); border-color: var(--ok-color); }
    .right-tile.denied  { background: var(--no-bg); color: var(--no-color); border-color: var(--no-color); opacity: .8; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: left; }
    th { padding: 6px 10px; border-bottom: 1px solid var(--border); color: var(--text-sec); background: var(--bg-alt); }
    td { padding: 6px 10px; border-bottom: 1px solid var(--border-subtle); user-select: text; }
    code { font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 11px; }

    .footer {
      padding: 5px 14px; border-top: 1px solid var(--border); background: var(--bg-alt);
      display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--text-sec);
    }
    .pill { padding: 2px 8px; border-radius: 10px; color: #fff; font-weight: 600; background: var(--text-muted); }
    .spacer { flex: 1; }
  </style>
</head>
<body>

  <div class="setup-bar">
    <div class="field">
      <label>Principal (<select id="principal-type" style="width:auto;padding:1px 4px;font-size:10px;"><option value="systemuser">User</option><option value="team">Team</option></select>)</label>
      <input type="text" id="principal-filter" placeholder="Filter users/teams…" style="margin-bottom:4px;">
      <select id="principal-select"></select>
    </div>

    <div class="field">
      <label>Target Table</label>
      <input type="text" id="entity-filter" placeholder="Filter table…" style="margin-bottom:4px;">
      <select id="entity-select"></select>
    </div>

    <div class="field">
      <label>Target Record GUID <button class="btn" id="btn-pick-sample" style="padding:1px 6px;font-size:10px;float:right;">Pick Recent</button></label>
      <select id="recent-records" style="margin-bottom:4px;display:none;"></select>
      <input type="text" id="record-guid" placeholder="00000000-0000-0000-0000-000000000000" style="font-family:monospace;">
    </div>

    <div>
      <button class="btn btn-primary" id="btn-check" disabled style="height:34px;">🛡️ Check Access</button>
    </div>
  </div>

  <div class="body-scroll" id="results-area">
    <div style="text-align:center;padding:40px;color:var(--text-sec);">
      Choose a <strong>User or Team</strong>, select a <strong>Table</strong> and <strong>Record GUID</strong> (or click <em>Pick Recent</em>), then click <strong>Check Access</strong>.
    </div>
  </div>

  <footer class="footer">
    <span class="pill" id="tel-pill">Ready</span>
    <span id="tel-msg">Uses Microsoft.Dynamics.CRM.RetrievePrincipalAccess</span>
    <div class="spacer"></div>
    <span id="tel-user">—</span>
  </footer>

  <script>
    'use strict';

    const HOST_ORIGIN = window.location.origin;
    let context = null;
    let users = [];
    let teams = [];
    let entities = [];

    function toHost(type, payload = {}) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ source: 'dvopentools-tool', type, payload }, HOST_ORIGIN);
      }
    }
    function notify(message, level = 'info', duration = 3500) { toHost('NOTIFY', { message, level, duration }); }
    function setTitle(title) { toHost('SET_TITLE', { title }); }

    toHost('TOOL_READY');
    const _standaloneTimer = setTimeout(() => {
      if (!context) {
        context = { environmentUrl: location.origin, apiVersion: '9.2', theme: 'light', userId: '' };
        onContextReady();
      }
    }, 1500);

    window.addEventListener('message', e => {
      if (e.origin !== HOST_ORIGIN) return;
      const { source, type, payload } = e.data || {};
      if (source !== 'dvopentools-host') return;
      if (type === 'CONTEXT_INIT') { clearTimeout(_standaloneTimer); context = payload; onContextReady(); }
      if (type === 'THEME_CHANGE') { document.body.classList.toggle('dark', payload.theme === 'dark'); }
    });

    async function dvGet(path) {
      const url = `${context.environmentUrl}/api/data/v${context.apiVersion}${path}`;
      const t0 = performance.now();
      const res = await fetch(url, {
        headers: { 'OData-MaxVersion': '4.0', 'OData-Version': '4.0', 'Accept': 'application/json', 'Prefer': 'odata.include-annotations="*"' }
      });
      const ms = Math.round(performance.now() - t0);
      const pill = document.getElementById('tel-pill');
      pill.textContent = `${res.status} (${ms}ms)`;
      pill.style.background = res.ok ? 'var(--ok-color)' : 'var(--no-color)';
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json?.error?.message || `HTTP ${res.status}`);
      return json;
    }

    async function onContextReady() {
      document.body.classList.toggle('dark', context.theme === 'dark');
      document.getElementById('tel-user').textContent = context.userName || '';
      await Promise.allSettled([loadPrincipals(), loadEntities()]);
      document.getElementById('btn-check').disabled = false;
    }

    async function loadPrincipals() {
      const [uRes, tRes] = await Promise.allSettled([
        dvGet('/systemusers?$select=systemuserid,fullname,internalemailaddress,_businessunitid_value,isdisabled&$filter=isdisabled eq false&$orderby=fullname asc&$top=500'),
        dvGet('/teams?$select=teamid,name,teamtype,_businessunitid_value&$orderby=name asc&$top=500')
      ]);
      if (uRes.status === 'fulfilled') users = uRes.value.value || [];
      if (tRes.status === 'fulfilled') teams = tRes.value.value || [];
      renderPrincipalSelect();
    }

    async function loadEntities() {
      try {
        const res = await dvGet('/EntityDefinitions?$select=LogicalName,EntitySetName,DisplayName,PrimaryIdAttribute,PrimaryNameAttribute,OwnershipType&$filter=IsIntersect eq false');
        entities = (res.value || [])
          .filter(e => e.EntitySetName && e.PrimaryIdAttribute)
          .map(e => ({
            logicalName: e.LogicalName,
            entitySetName: e.EntitySetName,
            displayName: e.DisplayName?.UserLocalizedLabel?.Label || e.LogicalName,
            primaryId: e.PrimaryIdAttribute,
            primaryName: e.PrimaryNameAttribute || '',
            ownership: e.OwnershipType || 'UserOwned'
          }))
          .sort((a, b) => a.displayName.localeCompare(b.displayName));
        renderEntitySelect();
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    function renderPrincipalSelect() {
      const kind = document.getElementById('principal-type').value;
      const q = document.getElementById('principal-filter').value.trim().toLowerCase();
      const sel = document.getElementById('principal-select');
      const items = kind === 'systemuser'
        ? users.filter(u => !q || `${u.fullname} ${u.internalemailaddress || ''}`.toLowerCase().includes(q))
        : teams.filter(t => !q || (t.name || '').toLowerCase().includes(q));

      sel.innerHTML = items.map(item => {
        const id = kind === 'systemuser' ? item.systemuserid : item.teamid;
        const lbl = kind === 'systemuser'
          ? `${item.fullname}${item.internalemailaddress ? ' (' + item.internalemailaddress + ')' : ''}`
          : `${item.name} [${item['teamtype@OData.Community.Display.V1.FormattedValue'] || item.teamtype}]`;
        return `<option value="${esc(id)}">${esc(lbl)}</option>`;
      }).join('') || '<option value="">No matches</option>';
    }

    function renderEntitySelect() {
      const q = document.getElementById('entity-filter').value.trim().toLowerCase();
      const sel = document.getElementById('entity-select');
      const list = entities.filter(e => !q || e.displayName.toLowerCase().includes(q) || e.logicalName.toLowerCase().includes(q));
      sel.innerHTML = list.map(e => `<option value="${esc(e.logicalName)}">${esc(e.displayName)} (${esc(e.logicalName)})</option>`).join('');
      if (list.some(e => e.logicalName === 'account') && !q) sel.value = 'account';
    }

    async function pickRecentRecords() {
      const ln = document.getElementById('entity-select').value;
      const ent = entities.find(e => e.logicalName === ln);
      if (!ent) return;
      const sel = document.getElementById('recent-records');
      try {
        const cols = [ent.primaryId, ent.primaryName].filter(Boolean).join(',');
        const data = await dvGet(`/${ent.entitySetName}?$select=${cols}&$top=20`);
        const rows = data.value || [];
        if (!rows.length) { notify(`No records found in ${ent.logicalName}`, 'warning'); return; }
        sel.style.display = 'block';
        sel.innerHTML = '<option value="">Choose a recent record…</option>' + rows.map(r => {
          const id = r[ent.primaryId];
          const name = ent.primaryName ? (r[ent.primaryName] || id) : id;
          return `<option value="${esc(id)}">${esc(name)} (${esc(id.slice(0, 8))}…)</option>`;
        }).join('');
      } catch (err) {
        notify(err.message, 'error');
      }
    }

    async function checkAccess() {
      const kind = document.getElementById('principal-type').value;
      const principalId = document.getElementById('principal-select').value;
      const ln = document.getElementById('entity-select').value;
      const recordId = document.getElementById('record-guid').value.trim().replace(/[{}]/g, '');
      const ent = entities.find(e => e.logicalName === ln);

      if (!principalId || !ent || !recordId) {
        notify('Select principal, table, and enter a valid record GUID.', 'warning');
        return;
      }

      const area = document.getElementById('results-area');
      area.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-sec);">Running access diagnostics…</div>';

      try {
        const pSet = kind === 'systemuser' ? 'systemusers' : 'teams';
        const targetJson = encodeURIComponent(JSON.stringify({ '@odata.id': `${ent.entitySetName}(${recordId})` }));
        const accessReq = dvGet(`/${pSet}(${principalId})/Microsoft.Dynamics.CRM.RetrievePrincipalAccess(Target=@tid)?@tid=${targetJson}`);

        const ownerSelect = [ent.primaryId, ent.primaryName].filter(Boolean);
        if (ent.ownership !== 'OrganizationOwned') ownerSelect.push('_ownerid_value', '_owningbusinessunit_value');
        const recordReq = dvGet(`/${ent.entitySetName}(${recordId})?$select=${ownerSelect.join(',')}`);

        const rolesReq = kind === 'systemuser'
          ? dvGet(`/systemusers(${principalId})/systemuserroles_association?$select=roleid,name,_businessunitid_value`)
          : dvGet(`/teams(${principalId})/teamroles_association?$select=roleid,name,_businessunitid_value`);

        const teamsReq = kind === 'systemuser'
          ? dvGet(`/systemusers(${principalId})/teammembership_association?$select=teamid,name,teamtype&$expand=teamroles_association($select=roleid,name)`)
          : Promise.resolve({ value: [] });

        const poaReq = dvGet(`/principalobjectaccessset?$filter=objectid eq ${recordId}&$select=principalid,principaltypecode,accessrightsmask,inheritedaccessrightsmask`).catch(() => ({ value: [] }));

        const [accessRes, recRes, rolesRes, teamsRes, poaRes] = await Promise.allSettled([accessReq, recordReq, rolesReq, teamsReq, poaReq]);

        if (accessRes.status === 'rejected') throw new Error(accessRes.reason.message);

        const rawMask = String(accessRes.value?.AccessRights || 'None');
        const grantedList = rawMask.split(',').map(s => s.trim()).filter(Boolean);
        const allRights = ['ReadAccess', 'WriteAccess', 'AppendAccess', 'AppendToAccess', 'DeleteAccess', 'ShareAccess', 'AssignAccess'];

        const rec = recRes.status === 'fulfilled' ? recRes.value : null;
        const directRoles = rolesRes.status === 'fulfilled' ? (rolesRes.value.value || []) : [];
        const memberTeams = teamsRes.status === 'fulfilled' ? (teamsRes.value.value || []) : [];
        const poaRows = poaRes.status === 'fulfilled' ? (poaRes.value.value || []) : [];

        const isOwner = rec && rec._ownerid_value && rec._ownerid_value.toLowerCase() === principalId.toLowerCase();
        setTitle(`Access — ${ent.logicalName}`);

        area.innerHTML = `
          <div class="card">
            <div class="card-hdr">
              <span>Effective Access Rights (<code>RetrievePrincipalAccess</code>)</span>
              <span style="font-size:11px;color:var(--text-sec);">Mask: <code>${esc(rawMask)}</code></span>
            </div>
            <div class="card-body">
              <div class="rights-grid">
                ${allRights.map(r => {
                  const ok = grantedList.includes(r);
                  return `<div class="right-tile ${ok ? 'granted' : 'denied'}">
                    <span>${r.replace('Access', '')}</span>
                    <span>${ok ? '✔ Allowed' : '✕ Denied'}</span>
                  </div>`;
                }).join('')}
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-hdr"><span>Record Context &amp; Ownership</span></div>
            <div class="card-body">
              ${rec ? `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;">
                <div><strong>Record:</strong> ${esc(ent.primaryName ? (rec[ent.primaryName] || recordId) : recordId)}</div>
                <div><strong>Owner:</strong> ${esc(rec['_ownerid_value@OData.Community.Display.V1.FormattedValue'] || rec._ownerid_value || 'Organization Owned')} ${isOwner ? '<strong style="color:var(--ok-color);">(Principal IS Owner)</strong>' : ''}</div>
                <div><strong>Owning BU:</strong> ${esc(rec['_owningbusinessunit_value@OData.Community.Display.V1.FormattedValue'] || rec._owningbusinessunit_value || '—')}</div>
              </div>` : '<span style="color:var(--no-color);">Could not read target record details.</span>'}
            </div>
          </div>

          <div class="two-col">
            <div class="card">
              <div class="card-hdr"><span>Direct Security Roles (${directRoles.length})</span></div>
              <div class="card-body" style="padding:0;">
                ${directRoles.length ? `<table><thead><tr><th>Role Name</th><th>Business Unit</th></tr></thead><tbody>
                  ${directRoles.map(r => `<tr><td><strong>${esc(r.name)}</strong></td><td>${esc(r['_businessunitid_value@OData.Community.Display.V1.FormattedValue'] || '—')}</td></tr>`).join('')}
                </tbody></table>` : '<div style="padding:14px;color:var(--text-sec);">No direct security roles assigned.</div>'}
              </div>
            </div>

            <div class="card">
              <div class="card-hdr"><span>Team Memberships &amp; Inherited Roles (${memberTeams.length})</span></div>
              <div class="card-body" style="padding:0;">
                ${memberTeams.length ? `<table><thead><tr><th>Team</th><th>Team Roles</th></tr></thead><tbody>
                  ${memberTeams.map(t => `<tr><td><strong>${esc(t.name)}</strong></td><td>${esc((t.teamroles_association || []).map(r => r.name).join(', ') || 'None')}</td></tr>`).join('')}
                </tbody></table>` : '<div style="padding:14px;color:var(--text-sec);">No team memberships (or principal is a team).</div>'}
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-hdr"><span>Explicit Record Shares (PrincipalObjectAccess: ${poaRows.length})</span></div>
            <div class="card-body" style="padding:0;">
              ${poaRows.length ? `<table><thead><tr><th>Principal ID</th><th>Type</th><th>Access Mask</th><th>Inherited Mask</th></tr></thead><tbody>
                ${poaRows.map(p => `<tr><td><code>${esc(p.principalid)}</code></td><td>${esc(p.principaltypecode)}</td><td><code>${p.accessrightsmask}</code></td><td><code>${p.inheritedaccessrightsmask}</code></td></tr>`).join('')}
              </tbody></table>` : '<div style="padding:14px;color:var(--text-sec);">No explicit PrincipalObjectAccess share entries found on this record.</div>'}
            </div>
          </div>
        `;
      } catch (err) {
        area.innerHTML = `<div class="card"><div class="card-body" style="color:var(--no-color);">❌ ${esc(err.message)}</div></div>`;
        notify(err.message, 'error');
      }
    }

    document.getElementById('principal-type').addEventListener('change', renderPrincipalSelect);
    document.getElementById('principal-filter').addEventListener('input', renderPrincipalSelect);
    document.getElementById('entity-filter').addEventListener('input', renderEntitySelect);
    document.getElementById('btn-pick-sample').addEventListener('click', pickRecentRecords);
    document.getElementById('recent-records').addEventListener('change', e => {
      if (e.target.value) document.getElementById('record-guid').value = e.target.value;
    });
    document.getElementById('btn-check').addEventListener('click', checkAccess);

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
